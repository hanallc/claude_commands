# Machines that can run build jobs, in the order a job tries them.
targets=hana-aws,mac,mac-linux,natedev
pinned_targets=hana-gpu
kind.hana-gpu=ssh
platform.hana-gpu=linux
settings.hana-gpu=cloud_gate.conf
# Default target for clear, drain, and release.
default_target=natedev
kind.natedev=local
platform.natedev=linux
kind.mac=ssh
platform.mac=macos
settings.mac=mac_test.conf
# Register the Linux guest on the Mac.
kind.mac-linux=ssh
platform.mac-linux=linux
settings.mac-linux=mac_linux.conf
# one of: on, off
enabled.mac-linux=off
# Register Hana without adding it to the active target order.
kind.hana-aws=ssh
platform.hana-aws=linux
settings.hana-aws=hana_aws.conf

# Maximum seconds for a notice to the hold's owner.
# range: 0.01..300
hold_sender_timeout_seconds=30

# Seconds before a machine sends a notice for an outage.
# whole: 1..86400
excluded_notice_seconds=3600
# whole: 1..86400
excluded_notice_seconds.mac=600

# A run on a machine that does not answer for this many seconds ends as failed
# with the reason "unreachable" and frees its place. One value for every machine.
# whole: 1..86400
unreachable_wait_seconds=600

# Host names in synchronized records.
sync.hosts.natedev=natedev
sync.hosts.mac=Mac,Nates-MacBook-Pro-2023,mac,macbook
sync.hosts.aws=aws-build
sync.connect_timeout_s=10
sync.reach_timeout_s=30
sync.rsync_timeout_s=600

# Production that receives vault stop questions.
vault.question_production=natedev
# Extra tries after a busy vault index lock.
# whole: 0..10
vault.lock_retries=5
# Seconds between tries after a busy vault index lock.
# range: 0..5
vault.lock_retry_delay_s=3
# Seconds to observe the same lock identity, or no identity, before asking the user.
# range: 1..86400
vault.lock_question_age_s=7200

# AWS hana receiver deadlines.
# range: 1..3600
loopback.command_timeout_s=600
loopback.shell_timeout_s=120
