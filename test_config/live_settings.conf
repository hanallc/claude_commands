# Settings that /tune makes live at once; the commit, push and Mac pull follow.

# The notes parts that read each config file, as <stem>:<part> pairs, or none.
# /tune starts each matching part at once after the write.
readers=accounts:quota

# Time limit for the fetch before the commit to main.
# whole: 1..
fetch_seconds=10

# Time limit for the push to origin.
# whole: 1..
push_seconds=10

# Time limit for the Mac pull after the push.
# whole: 1..
mac_pull_seconds=20

# Time limit for the live write on the Mac.
# whole: 1..
mac_write_seconds=10

# Time limit for each probe of an asleep Mac while a Mac pull waits.
# whole: 1..
mac_wake_probe_seconds=5

# Pause between two probes of an asleep Mac.
# whole: 1..
mac_wake_pause_seconds=10
