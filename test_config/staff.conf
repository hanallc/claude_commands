# Staff operation lock limit, in seconds.
# range: 0.001..
OPERATION_LOCK_SECONDS=30

# Remote read and write limit, in seconds.
# range: 0.001..
REMOTE_SECONDS=20

# Workspace for each producer's tab.
PRODUCER_WORKSPACE=producers

# Root folder for producer documents.
PRODUCER_FOLDER_ROOT=~/rust/hanadocs

# Set the producer folder size limit in MB.
# whole: 1..
producer_folder_limit_mb=10
