[package]
authors     = ["natepiano"]
description = "Read Rust source facts from git blobs for the style refill"
edition     = "2024"
license     = "MIT OR Apache-2.0"
name        = "style_reader"
publish     = false
repository  = "https://github.com/natepiano/claude_commands"
version     = "0.1.0"

[lints]
workspace = true

[dependencies]
gix        = { workspace = true, features = ["max-performance-safe", "sha1"] }
libc       = { workspace = true }
rayon      = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
