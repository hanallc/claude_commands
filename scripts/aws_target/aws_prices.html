<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS prices</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --card: #fcfcfb; --line: #dcdad4; --hover: #efede8;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #66645f; --accent: #2a78d6; --room: #1baf7a; --edge: rgb(0 0 0 / 0.18);
  --low: #d9e8fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --card: #1a1a19; --line: #34332f; --hover: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #9a988f; --accent: #3987e5; --room: #199e70; --edge: rgb(0 0 0 / 0.6);
    --low: #1f3a5c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --card: #1a1a19; --line: #34332f; --hover: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #9a988f; --accent: #3987e5; --room: #199e70; --edge: rgb(0 0 0 / 0.6);
    --low: #1f3a5c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; margin: 0 0 4px; }
h2 .unit { font-size: 0.82rem; font-weight: 400; color: var(--ink-3); }
.status { display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 0.88rem; margin: 2px 0 16px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--room); flex: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; margin: 0 0 16px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.note { color: var(--ink-2); font-size: 0.86rem; margin: 6px 0 0; max-width: 78ch; }
.answer { font-size: 1.05rem; font-weight: 600; margin: 12px 0 0; }
/* A wide table scrolls inside its card: the first column stays, and a shadow marks more columns at the right edge. */
.scroll { overflow-x: auto;
  background: linear-gradient(to left, var(--card) 40%, transparent) right / 36px 100% no-repeat local,
              radial-gradient(farthest-side at 100% 50%, var(--edge), transparent) right / 14px 100% no-repeat scroll; }
table { border-collapse: collapse; font-size: 0.86rem; margin-top: 6px; min-width: 100%; }
th, td { text-align: left; padding: 5px 6px 5px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { white-space: normal; vertical-align: bottom; }
/* A header wraps only between words, never at the hyphen of a region name. */
thead th span { white-space: nowrap; }
tbody th.group { color: var(--ink); padding-top: 16px; }
th:first-child, td:first-child { padding-left: 0; position: sticky; left: 0; z-index: 1; background: var(--card); }
.scroll.overflows th:first-child, .scroll.overflows td:first-child { padding-right: 12px; box-shadow: inset -1px 0 var(--line); }
th { color: var(--ink-2); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--hover); }
/* A header "name (unit)" shows the unit on a smaller second line. */
thead th small { display: block; font-size: 0.76rem; font-weight: 400; color: var(--ink-3); white-space: nowrap; }
/* Lowest prices: a fill for the lowest of the type, an outline for the lowest of its vCPU count; a cell can be both. */
.mark { display: inline-block; padding: 1px 6px; margin: -1px -6px; border-radius: 4px; }
.mark.low { background: var(--low); }
.mark.group-low { box-shadow: inset 0 0 0 1.5px var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 10px 0 0; font-size: 0.82rem; color: var(--ink-2); }
.legend .mark { margin: 0 6px 0 0; }
.snapshot { list-style: none; padding: 0; margin: 12px 0 0; font-size: 0.86rem; color: var(--ink-2); }
.snapshot li { padding: 2px 0; }
.filter { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.filter button { font: inherit; font-size: 0.86rem; color: var(--ink-2); background: transparent; border: 0; padding: 5px 12px; cursor: pointer; }
.filter button + button { border-left: 1px solid var(--line); }
.filter button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.filter button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* The region filter stays at the top of the view while the page scrolls. */
.regions { position: sticky; top: 0; z-index: 3; display: flex; align-items: baseline; gap: 10px; background: var(--bg);
  padding: 8px 0 12px; margin: 0 0 4px; border-bottom: 1px solid var(--line); }
.regions-label { color: var(--ink-2); font-size: 0.86rem; font-weight: 600; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 0.84rem; color: var(--ink-2); background: var(--card); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 11px; cursor: pointer; }
.chips button:hover { background: var(--hover); }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips .all { font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>AWS prices</h1>
<div class="status"><span class="dot" aria-hidden="true"></span><span id="published"></span></div>
<nav class="regions" aria-label="Regions to show">
  <span class="regions-label" id="regions-label">Regions</span>
  <div class="chips" role="group" aria-labelledby="regions-label" id="regions"></div>
</nav>
<div id="prices"></div>
<div id="quotas"></div>
<section class="card" id="runs">
  <div class="card-head">
    <h2>Cost per run</h2>
    <div class="filter" role="group" aria-label="Runs to count" id="filter"></div>
  </div>
  <p class="answer" id="cheapest"></p>
  <p class="note" id="explanation"></p>
  <div id="run-tables"></div>
</section>
<section class="card" id="refused"></section>
<section class="card" id="launched"></section>
<section class="card" id="hours"></section>
</main>
<script id="aws-prices-data" type="application/json">__AWS_PRICES_DATA__</script>
<script>
"use strict";
const data = JSON.parse(document.getElementById("aws-prices-data").textContent);
const SCOPE_KEY = "aws-prices-scope";
const REGIONS_KEY = "aws-prices-regions";
const NOTHING_SHOWN = "Nothing to show in the chosen regions.";
let shown = new Set(data.regions);
let scope = null;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function remembered(key) {
  try { return localStorage.getItem(key); } catch (error) { return null; }
}

function remember(key, value) {
  try { localStorage.setItem(key, value); } catch (error) { /* The choice is kept only for this view. */ }
}

// The columns and rows of a table in the chosen regions; the first column always shows.
function visible(table) {
  const columns = table.headers.map((_header, index) => index)
    .filter(index => index === 0 || table.region_axis !== "columns" || shown.has(table.headers[index]));
  const rows = table.rows.map((_row, index) => index)
    .filter(index => table.region_axis !== "rows" || shown.has(table.rows[index][0]));
  return { columns, rows };
}

// For each ranking, the cells of its first set that has a cell in view: the lowest price in the chosen regions.
function lowestShown(rankings, view) {
  const columns = new Set(view.columns);
  const marked = new Set();
  for (const ranking of rankings || []) {
    for (const ties of ranking) {
      const inView = ties.filter(([, column]) => columns.has(column));
      if (inView.length) { inView.forEach(cell => marked.add(String(cell))); break; }
    }
  }
  return marked;
}

// Draw tables with the same headers as one grid, so their columns line up; a titled row starts each table.
function tableElement(tables, titled) {
  const first = tables[0];
  const right = new Set(first.right);
  const { columns } = visible(first);
  const wrap = element("div", undefined, "scroll");
  const grid = element("table");
  const head = grid.createTHead().insertRow();
  for (const index of columns) {
    const cell = element("th", undefined, right.has(index) ? "n" : "");
    const [, name, unit] = first.headers[index].match(/^(.*?)(?: (\(.*\)))?$/);
    name.split(" ").forEach((word, position) => cell.append(...(position ? [" "] : []), element("span", word)));
    if (unit) cell.appendChild(element("small", unit));
    cell.scope = "col";
    head.appendChild(cell);
  }
  for (const table of tables) {
    const view = visible(table);
    const body = grid.createTBody();
    if (titled) {
      const title = element("th", table.title, "group");
      title.colSpan = columns.length;
      title.scope = "rowgroup";
      body.insertRow().appendChild(title);
    }
    const low = lowestShown(table.row_ranks, view);
    const groupLow = lowestShown(table.group_ranks, view);
    for (const rowIndex of view.rows) {
      const line = body.insertRow();
      for (const index of columns) {
        const value = table.rows[rowIndex][index];
        const place = String([rowIndex, index]);
        const marks = [low.has(place) ? "low" : "", groupLow.has(place) ? "group-low" : ""].filter(Boolean);
        const cell = element("td", marks.length ? undefined : value, right.has(index) ? "n" : "");
        if (marks.length) cell.appendChild(element("span", value, ["mark", ...marks].join(" ")));
        line.appendChild(cell);
      }
    }
  }
  wrap.appendChild(grid);
  return wrap;
}

function heading(text) {
  const [, name, unit] = text.match(/^(.*?)(?: (\(.*\)))?$/);
  const title = element("h2", name);
  if (unit) title.appendChild(element("small", " " + unit, "unit"));
  return title;
}

// A table shows when a row and a region of it are in the chosen regions.
function shows(tables) {
  return tables.some(table => {
    const view = visible(table);
    return view.rows.length && (table.region_axis !== "columns" || view.columns.length > 1);
  });
}

function fill(section, table, note) {
  section.replaceChildren(heading(table.title));
  if (note) section.appendChild(element("p", note, "note"));
  if (shows([table])) section.appendChild(tableElement([table], false));
  else if (table.rows.length) section.appendChild(element("p", NOTHING_SHOWN, "note"));
  return section;
}

function cards(id, tables) {
  const holder = document.getElementById(id);
  const sections = tables.map(table => fill(element("section", undefined, "card"), table));
  holder.replaceChildren(...sections);
  return sections;
}

function swatch(marks, text) {
  const item = element("span");
  item.append(element("span", "0.00", ["mark", ...marks].join(" ")), text);
  return item;
}

const published = new Date(data.read_at * 1000);
document.getElementById("published").textContent =
  `Published ${published.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}. The hourly AWS snapshot job publishes it again.`;

function markOverflow() {
  for (const wrap of document.querySelectorAll(".scroll")) wrap.classList.toggle("overflows", wrap.scrollWidth > wrap.clientWidth + 1);
}
addEventListener("resize", markOverflow);

function drawFixed() {
  const priceCards = cards("prices", data.prices);
  const legend = element("p", undefined, "legend");
  legend.append(swatch(["low"], "lowest price of the type"), swatch(["group-low"], "lowest price of the types with the same vCPU count"));
  priceCards[0].appendChild(legend);
  const snapshot = element("ul", undefined, "snapshot");
  for (const line of data.snapshot) if (!line.region || shown.has(line.region)) snapshot.appendChild(element("li", line.text));
  priceCards[priceCards.length - 1].appendChild(snapshot);
  cards("quotas", data.quotas);
  fill(document.getElementById("hours"), data.hours, data.hours_note);
}

const filter = document.getElementById("filter");
function drawScope() {
  const costs = data.runs.find(entry => entry.scope === scope) || data.runs[0];
  for (const button of filter.children) button.setAttribute("aria-pressed", String(button.dataset.scope === costs.scope));
  const cheapest = costs.estimates.find(entry => shown.has(entry.region));
  document.getElementById("cheapest").textContent = cheapest ? cheapest.summary : costs.no_estimate;
  document.getElementById("explanation").textContent = costs.explanation;
  const tables = document.getElementById("run-tables");
  tables.replaceChildren(shows(costs.tables) ? tableElement(costs.tables, true) : element("p", NOTHING_SHOWN, "note"));
  fill(document.getElementById("refused"), costs.refused);
  fill(document.getElementById("launched"), costs.launched);
}

function draw() {
  drawFixed();
  drawScope();
  markOverflow();
}

function showScope(next) {
  scope = next;
  drawScope();
  markOverflow();
  remember(SCOPE_KEY, scope);
}
for (const costs of data.runs) {
  const button = element("button", costs.label);
  button.type = "button";
  button.dataset.scope = costs.scope;
  button.addEventListener("click", () => showScope(costs.scope));
  filter.appendChild(button);
}

// The region filter: all regions by default, any combination; the last chosen region stays on.
const chips = document.getElementById("regions");
const allChip = element("button", "All", "all");
allChip.type = "button";
chips.appendChild(allChip);
const regionChips = data.regions.map(region => {
  const chip = element("button", region);
  chip.type = "button";
  chip.dataset.region = region;
  chips.appendChild(chip);
  return chip;
});
function showRegions(next) {
  shown = next;
  allChip.setAttribute("aria-pressed", String(shown.size === data.regions.length));
  for (const chip of regionChips) chip.setAttribute("aria-pressed", String(shown.has(chip.dataset.region)));
  draw();
  remember(REGIONS_KEY, JSON.stringify([...shown]));
}
allChip.addEventListener("click", () => showRegions(new Set(data.regions)));
for (const chip of regionChips) {
  chip.addEventListener("click", () => {
    const next = new Set(shown);
    if (next.has(chip.dataset.region)) next.delete(chip.dataset.region); else next.add(chip.dataset.region);
    if (next.size) showRegions(next);
  });
}

let saved = [];
try { saved = JSON.parse(remembered(REGIONS_KEY) || "[]"); } catch (error) { saved = []; }
const known = Array.isArray(saved) ? data.regions.filter(region => saved.includes(region)) : [];
scope = remembered(SCOPE_KEY);
showRegions(new Set(known.length ? known : data.regions));
</script>
</body>
</html>
