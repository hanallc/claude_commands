targets=hana-aws,mac,natedev
pinned_targets=hana-gpu
default_target=natedev
kind.natedev=local
platform.natedev=linux
kind.mac=ssh
platform.mac=macos
settings.mac=mac_test.conf
kind.hana-aws=ssh
platform.hana-aws=linux
settings.hana-aws=hana_aws.conf
kind.hana-gpu=ssh
platform.hana-gpu=linux
settings.hana-gpu=cloud_gate.conf

# one of: on, off
enabled.mac=on
# one of: on, off
enabled.aws-gate=on
# one of: on, off
enabled.hana-aws=off
# one of: on, off
enabled.hana-gpu=on

# range: 0.01..300
hold_sender_timeout_seconds=30

# whole: 1..86400
unreachable_wait_seconds=600

loopback.host=natedev
loopback.port=
loopback.known_hosts=
# range: 1..60
loopback.connect_timeout_s=6
loopback.probe_timeout_s=30
# range: 1..3600
loopback.command_timeout_s=600
loopback.free_floor_gib=1
loopback.build_budget_gib=16
loopback.target_budget_gib=1
loopback.shell_timeout_s=120
loopback.shell=default
loopback.memory_gib=16
