<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disks</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --card: #fcfcfb; --line: #dcdad4; --hover: #efede8;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #66645f; --accent: #2a78d6; --room: #1baf7a;
  --track: #e8e6e0; --band: #dcdad4; --floor: #c98a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --card: #1a1a19; --line: #34332f; --hover: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #9a988f; --accent: #3987e5; --room: #199e70;
    --track: #232321; --band: #33322e; --floor: #e0a530;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --card: #1a1a19; --line: #34332f; --hover: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #9a988f; --accent: #3987e5; --room: #199e70;
  --track: #232321; --band: #33322e; --floor: #e0a530;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
__PAGE_FRAME_STYLE__
h2 { font-size: 1.05rem; margin: 0; }
h2 .path { font-size: 0.86rem; font-weight: 400; color: var(--ink-3); margin-left: 6px; }
.status { display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 0.88rem; margin: 0 0 16px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--room); flex: none; }
.dot.old { background: var(--ink-3); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 0 0 16px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; min-width: 0; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.free { font-size: 1.05rem; font-weight: 600; }
.free small { font-weight: 400; color: var(--ink-2); font-size: 0.86rem; }
.bar { position: relative; height: 12px; border-radius: 6px; background: var(--track); margin: 12px 0 6px; }
.bar .used { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--accent); }
.bar .floor { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--floor); border-radius: 1px; }
.note { color: var(--ink-2); font-size: 0.84rem; margin: 0 0 12px; }
.note .mark { display: inline-block; width: 2px; height: 11px; background: var(--floor); margin: 0 6px -1px 0; }
.limit { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 0.86rem; color: var(--ink-2); margin: 0 0 6px; }
.limit .range { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
.limit input { flex: 1; min-width: 60px; accent-color: var(--accent); }
/* Fixed widths keep the slider the same width while its value text changes during a drag. */
.limit output { width: 72px; flex: none; white-space: nowrap; text-align: right; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.limit .end.low { text-align: right; }
.limit .end { min-width: 52px; flex: none; white-space: nowrap; color: var(--ink-3); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; table-layout: fixed; }
th, td { text-align: left; padding: 5px 0 5px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th:first-child, td:first-child { padding-left: 0; }
th { color: var(--ink-2); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.path { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.82rem; }
/* A long folder name wraps, so no name is cut. */
.tree td:first-child { white-space: normal; overflow-wrap: anywhere; }
td.dim, .dim { color: var(--ink-3); }
tbody tr:hover td { background: var(--hover); }
.slots col.size { width: 80px; } .slots col.used { width: 120px; }
.slots td:first-child, .slots td.use { white-space: normal; overflow-wrap: break-word; }
.slots .tag { white-space: nowrap; }
.slots .narrow { display: none; margin-top: 2px; font-family: system-ui, sans-serif; }
/* A repository is a band that opens and closes; its slots sit indented below it. */
.slots tr.group th { padding: 7px 10px 7px 6px; border-top: 4px solid var(--card); background: color-mix(in srgb, var(--accent) 12%, var(--card));
  background-clip: padding-box; color: var(--ink); white-space: normal; cursor: pointer; }
.slots tr.group:hover th { background-color: color-mix(in srgb, var(--accent) 18%, var(--card)); }
.slots tr.group .name { font-weight: 700; }
.slots tr.group .sum { color: var(--ink-2); font-weight: 400; margin-left: 8px; }
.slots tr.group .folder { display: inline-flex; margin-right: 6px; color: var(--accent); vertical-align: -2px; }
.slots tr.group .folder svg { width: 15px; height: 15px; }
.slots tbody td:first-child { padding-left: 26px; }
[aria-expanded]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sessions col.size { width: 80px; } .sessions col.share { width: 18%; } .sessions col.state { width: 96px; }
.sessions td.held { white-space: normal; overflow-wrap: anywhere; }
.share i { display: block; height: 8px; min-width: 2px; border-radius: 3px; background: var(--accent); opacity: 0.7; }
.tag { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 0.76rem; line-height: 18px; border: 1px solid var(--line); color: var(--ink-2); margin-right: 6px; }
.tag.run { border-color: transparent; background: color-mix(in srgb, var(--room) 22%, transparent); color: var(--ink); }
.tag.go { border-color: color-mix(in srgb, var(--floor) 60%, transparent); color: var(--floor); }
.tree col.place { width: 50%; } .tree col.size { width: 78px; } .tree col.pct { width: 84px; }
.tree tr[aria-expanded] > td { cursor: pointer; }
.twist { display: inline-flex; width: 14px; text-indent: 0; color: var(--ink-3); vertical-align: -2px; }
.twist svg { width: 14px; height: 14px; }
.slots .twist { width: 18px; }
tr[aria-expanded="true"] .twist svg { transform: rotate(90deg); }
.walk { position: relative; height: 10px; }
.walk .span { position: absolute; top: 0; bottom: 0; background: var(--track); border-radius: 3px; }
.walk .span.inner { background: var(--band); }
.walk .seg { position: absolute; top: 1px; bottom: 1px; min-width: 2px; border-radius: 3px; background: var(--accent); opacity: 0.7; }
.walk .seg.other { background: var(--ink-3); opacity: 0.45; }
.problem { color: var(--ink-2); font-size: 0.86rem; margin: 12px 0 0; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .card { padding: 14px 12px 10px; }
  .tree col.place { width: auto; } .tree col.size { width: 64px; } .tree col.pct { width: 0; } .tree col.walk { width: 64px; }
  .tree .pct { display: none; }
  /* On a phone the holder goes under the slot name, so each column keeps its width. */
  .slots col.used { width: 96px; } .slots col.use { width: 0; }
  .slots td:nth-child(3) { white-space: normal; }
  .slots .wide { display: none; }
  .slots .narrow { display: block; }
  .sessions col.size { width: 64px; } .sessions col.share { width: 0; } .sessions col.state { width: 72px; }
  .sessions .share { display: none; }
  .sessions th { white-space: normal; }
}
</style>
</head>
<body>
<main>
  <h1 class="page-title">Disks</h1>
  <div class="status"><span class="dot" id="dot" hidden></span><span id="status">Reading the sizes…</span></div>
  <div class="grid" id="drives"></div>
  <div class="grid" id="cards">
    <section class="card" id="slots" hidden></section>
    <section class="card" id="sessions" hidden></section>
  </div>
</main>
<script id="disks-settings" type="application/json">__DISKS_SETTINGS__</script>
<script>
const GIB = 1024 ** 3;
const SLIDER_STEPS = 1000;
// Lucide 0.468.0 icons (ISC license): the chevron turns down on an open row; the folder marks a repository.
const icon = path => '<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
  + ` stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>`;
const CHEVRON = icon("m9 18 6-6-6-6");
const FOLDER = icon("M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z");

function size(bytes) {
  const gib = bytes / GIB;
  if (gib >= 1024) return (gib / 1024).toFixed(1) + " TiB";
  if (gib >= 10) return Math.round(gib) + " GiB";
  if (gib >= 1) return gib.toFixed(1) + " GiB";
  return Math.round(bytes / 1024 ** 2) + " MiB";
}

function share(part, whole) {
  return !whole || part / whole < 0.005 ? "<1%" : Math.round(100 * part / whole) + "%";
}

// The slider runs on a log scale from the configured least value to the largest top folder.
function sliderRange(tree, settings) {
  const min = settings.slider_min_gib * GIB;
  const largest = Math.max(0, ...tree.children.map(child => child.size));
  return {min, max: Math.max(largest, min)};
}

function toSlider(limit, range) {
  if (range.max <= range.min) return 0;
  return Math.round(SLIDER_STEPS * Math.log(limit / range.min) / Math.log(range.max / range.min));
}

function fromSlider(position, range) {
  return range.min * (range.max / range.min) ** (position / SLIDER_STEPS);
}

function startLimit(range, settings) {
  return Math.min(range.max, Math.max(range.min, settings.slider_default_gib * GIB));
}

function topPath(mount, name) {
  return (mount.endsWith("/") ? mount : mount + "/") + name;
}

// The size filter names top folders only. Smaller top folders join one Other row, which opens to list them.
// One small top folder shows by its name. Below the top, every measured folder shows. A folder's own files hold
// its files and its folders below the measure's limit; own files below the measure's limit alone get no row.
function treeRows(node, mount, state, keepBytes) {
  const out = [];
  const children = [...node.children].sort((a, b) => b.size - a.size);
  let shown = children.filter(child => child.size >= state.limit);
  let rest = children.filter(child => child.size < state.limit);
  if (rest.length === 1) { shown = [...shown, rest[0]]; rest = []; }
  const at = folderRows(shown, node.size, mount, state, keepBytes, "", 0, 0, out);
  const files = node.other >= keepBytes;
  if (!rest.length) {
    if (files) out.push(filesRow(node.other, 0, node.size, 0, at));
    return out;
  }
  const size = rest.reduce((total, child) => total + child.size, 0) + node.other;
  const path = otherPath(mount);
  const open = state.opened.has(path);
  out.push({kind: open ? "open" : "shut", other: true, path, name: `Other · ${rest.length} folders${files ? " and files" : ""}`,
            depth: 0, size, parentSize: node.size, parentStart: 0, start: at});
  if (open) {
    const end = folderRows(rest, size, mount, state, keepBytes, "", 1, at, out);
    if (files) out.push(filesRow(node.other, 1, size, at, end));
  }
  return out;
}

// The Other row's key. A folder path starts with "/", so no folder has this key.
function otherPath(mount) {
  return "other:" + mount;
}

// Rows for the folders of one parent, each at its running offset; an open folder lists all its measured folders.
// The path is empty for top folders. Returns the offset after the last folder.
function folderRows(children, parentSize, mount, state, keepBytes, path, depth, start, out) {
  let at = start;
  for (const child of children) {
    const childPath = path ? path + "/" + child.name : topPath(mount, child.name);
    const folds = child.children.length > 0;
    const open = folds && state.opened.has(childPath);
    out.push({kind: folds ? (open ? "open" : "shut") : "leaf", path: childPath, name: path ? child.name : childPath,
              depth, size: child.size, parentSize, parentStart: start, start: at});
    if (open) {
      const inner = [...child.children].sort((a, b) => b.size - a.size);
      const end = folderRows(inner, child.size, mount, state, keepBytes, childPath, depth + 1, at, out);
      if (child.other >= keepBytes) out.push(filesRow(child.other, depth + 1, child.size, at, end));
    }
    at += child.size;
  }
  return at;
}

function filesRow(size, depth, parentSize, parentStart, start) {
  return {kind: "files", path: "", name: "Files and small folders", depth, size, parentSize, parentStart, start};
}

// The keys a drive's rows can have: its Other row and each folder path, made as folderRows makes them.
// A folder name can hold "/" (a chain the measure joins), so the walk adds whole names.
function driveKeys(drive) {
  const keys = new Set([otherPath(drive.mount)]);
  const walk = (children, path) => {
    for (const child of children) {
      const childPath = path ? path + "/" + child.name : topPath(drive.mount, child.name);
      keys.add(childPath);
      walk(child.children, childPath);
    }
  };
  walk(drive.tree.children, "");
  return keys;
}

// The open-row keys to keep. The drive with the longest mount owns a path; a path whose drive has no tree is kept.
function knownFolders(drives, paths) {
  const keys = new Map(drives.filter(drive => drive.tree).map(drive => [drive.mount, driveKeys(drive)]));
  const owner = path => drives
    .filter(drive => path === otherPath(drive.mount) || path.startsWith(topPath(drive.mount, "")))
    .reduce((best, drive) => !best || drive.mount.length > best.mount.length ? drive : best, null);
  return new Set([...paths].filter(path => {
    const drive = owner(path);
    return drive && (!drive.tree || keys.get(drive.mount).has(path));
  }));
}

function clock(seconds) {
  const when = new Date(seconds * 1000), today = new Date();
  const time = when.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return when.toDateString() === today.toDateString() ? time
    : when.toLocaleDateString([], {month: "short", day: "numeric"}) + ", " + time;
}

function age(seconds) {
  const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"} ago`;
  if (seconds < 60) return "less than a minute ago";
  if (seconds < 3600) return plural(Math.floor(seconds / 60), "minute");
  if (seconds < 86400) return plural(Math.floor(seconds / 3600), "hour");
  return plural(Math.floor(seconds / 86400), "day");
}

function measuredText(measuredAt, now) {
  return `Sizes from ${clock(measuredAt)}, ${age(Math.max(0, now - measuredAt))}.`;
}

function minutes(seconds) {
  const count = Math.round(seconds / 60);
  return `${count} minute${count === 1 ? "" : "s"}`;
}

// The status line: the age of the sizes, then a running measure or when the next measure starts, then a problem.
function statusText(measuredAt, now, measuring, problem, cacheSeconds) {
  if (measuredAt == null) return measuring ? "Measuring the drives. The first measure takes some minutes." : problem || "No sizes yet.";
  const next = measuring ? "Measuring…"
    : `The page measures again when you open it and the sizes are more than ${minutes(cacheSeconds)} old.`;
  return [measuredText(measuredAt, now), next, problem].filter(Boolean).join(" ");
}

function floorNote(drive) {
  if (drive.floor == null || !drive.total) return "The cleanup floor is unknown.";
  return `Cleanup starts below ${size(drive.floor)} free (${Math.round(100 * drive.floor / drive.total)}%).`;
}

function esc(text) {
  return String(text).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
}

// The Slots card: one band per repository; an open band lists its slots with size, last use and holder.
// A slot below the measure's least folder shows as below it; a slot on no measured drive shows no size.
function slotsHtml(report, keepBytes, now, opened) {
  const slotSize = bytes => bytes == null ? "—" : keepBytes && bytes < keepBytes ? `&lt; ${size(keepBytes)}` : size(bytes);
  const total = rows => rows.some(row => row.size != null) ? rows.reduce((sum, row) => sum + (row.size || 0), 0) : null;
  const lastUsed = row => row.used_by ? "now" : row.last_used == null ? "—" : age(Math.max(0, now - row.last_used));
  const usedBy = row => {
    if (row.used_by) {
      const who = row.used_by.showrunner ? `${row.used_by.unit} (${row.used_by.showrunner})` : row.used_by.unit;
      return (row.used_by.purpose ? `<span class="tag run">${esc(row.used_by.purpose)}</span>` : "")
        + `<span class="dim">${esc(who)}</span>`;
    }
    return row.deleted_tonight ? '<span class="tag go">deleted tonight</span>' : "";
  };
  const slotRow = row => {
    const use = usedBy(row);
    return `<tr><td class="path">${esc(row.name)}${use ? `<div class="narrow">${use}</div>` : ""}</td>`
      + `<td class="n">${slotSize(row.size)}</td><td>${lastUsed(row)}</td>`
      + (use ? `<td class="use wide">${use}</td>` : '<td class="dim wide">—</td>') + "</tr>";
  };
  const groups = report.groups.map(group => {
    const count = group.maximum ? `${group.slots.length} of ${group.maximum} slots`
      : `${group.slots.length} slot${group.slots.length === 1 ? "" : "s"}`;
    const open = opened.has(group.repository);
    return `<tr class="group" tabindex="0" aria-expanded="${open}" data-group="${esc(group.repository)}"><th colspan="4">`
      + `<span class="twist">${CHEVRON}</span><span class="folder">${FOLDER}</span><span class="name">${esc(group.repository)}</span>`
      + `<span class="sum">${count} · ${slotSize(total(group.slots))}</span></th></tr>` + (open ? group.slots.map(slotRow).join("") : "");
  }).join("");
  const body = groups ? `<table class="slots"><colgroup><col><col class="size"><col class="used"><col class="use"></colgroup>`
    + `<thead><tr><th>Slot</th><th class="n">Size</th><th>Last used</th><th class="wide">Used by</th></tr></thead><tbody>${groups}</tbody></table>`
    : '<p class="problem">No slots yet.</p>';
  return `<h2>Slots<span class="path">${esc(report.root)}</span></h2>${body}`;
}

// The Sessions card: each session folder, largest first, with its held folders and whether its session runs.
// The largest folders show by name; one row adds up the rest.
function sessionsHtml(report, keepBytes, shown) {
  const folderSize = bytes => bytes == null ? "—" : keepBytes && bytes < keepBytes ? `&lt; ${size(keepBytes)}` : size(bytes);
  const largest = Math.max(0, ...report.sessions.map(row => row.size || 0));
  const held = row => row.held.length ? row.held.map(folder => `<span title="${esc(folder.task)}">${esc(folder.name)}</span>`
    + (folder.ended ? ' <span class="dim">(unsaved work)</span>' : "")).join(", ") : '<span class="dim">—</span>';
  const state = row => row.state === "ended" ? '<span class="tag go">ended</span>'
    : `<span class="dim">${row.state === "running" ? "running" : "—"}</span>`;
  const sessionRow = row => `<tr><td class="path">${esc(row.name)}</td><td class="n">${folderSize(row.size)}</td>`
    + `<td class="share">${row.size && largest ? `<i style="width:${(100 * row.size / largest).toFixed(1)}%"></i>` : ""}</td>`
    + `<td class="held">${held(row)}</td><td>${state(row)}</td></tr>`;
  const named = report.sessions.slice(0, shown), rest = report.sessions.slice(shown);
  const restSize = rest.some(row => row.size != null) ? rest.reduce((sum, row) => sum + (row.size || 0), 0) : null;
  const more = rest.length ? `<tr><td class="dim">${rest.length} more</td><td class="n dim">${folderSize(restSize)}</td>`
    + "<td class=\"share\"></td><td></td><td></td></tr>" : "";
  const body = named.length ? `<table class="sessions"><colgroup><col><col class="size"><col class="share"><col><col class="state"></colgroup>`
    + `<thead><tr><th>Session</th><th class="n">Size</th><th class="share" aria-label="Share of the largest session"></th>`
    + `<th>Held folders</th><th>State</th></tr></thead><tbody>${named.map(sessionRow).join("")}${more}</tbody></table>`
    : '<p class="problem">No session folders yet.</p>';
  return `<h2>Sessions<span class="path">${esc(report.root)}</span></h2>${body}`;
}

const settings = JSON.parse(document.getElementById("disks-settings").textContent);
const DATA_FILE = "disks.json";
const MEASURE = "measure";
const states = new Map();
// Open folders and slot repositories, kept across new data and reloads. Every row starts closed.
const OPEN_KEY = "disks-open";
const opened = readOpen();
const driveViews = new Map();
let data = null;
let slotReport = null;
let sessionReport = null;
let measuring = null;
let problem = "";

// A walk bar: the parent's span as a band, and this row's part of it at its running offset, on one scale for the drive.
function walk(row, scale) {
  const pct = bytes => (100 * bytes / scale).toFixed(3) + "%";
  return `<div class="walk"><div class="span${row.depth ? " inner" : ""}" style="left:${pct(row.parentStart)};width:${pct(row.parentSize)}"></div>`
    + `<div class="seg${row.kind === "files" || row.other ? " other" : ""}" style="left:${pct(row.start)};width:${pct(row.size)}"></div></div>`;
}

function rowHtml(row, scale) {
  // The twist hangs to the left, so a wrapped name lines up with its first line.
  const indent = `style="padding-left:${row.depth * 16 + 14}px;text-indent:-14px"`;
  const twist = row.kind === "open" || row.kind === "shut" ? CHEVRON : "";
  const toggle = row.kind === "open" || row.kind === "shut"
    ? ` tabindex="0" aria-expanded="${row.kind === "open"}" data-path="${esc(row.path)}"` : "";
  const dim = row.kind === "files" || row.other;
  const place = dim ? `<td class="dim" ${indent}>` : `<td class="path" ${indent} title="${esc(row.path)}">`;
  return `<tr${toggle}>${place}<span class="twist">${twist}</span>${esc(row.name)}</td>`
    + `<td class="n${dim ? " dim" : ""}">${size(row.size)}</td><td class="n dim pct">${share(row.size, row.parentSize)}</td>`
    + `<td>${walk(row, scale)}</td></tr>`;
}

function stateFor(drive, range) {
  if (!states.has(drive.mount)) {
    states.set(drive.mount, {limit: startLimit(range, settings), opened: opened.folders});
  }
  return states.get(drive.mount);
}

// Browser storage can be missing or blocked; the page then works with closed rows.
function readOpen() {
  try {
    const saved = JSON.parse(localStorage.getItem(OPEN_KEY) || "{}");
    return {folders: new Set(saved.folders || []), groups: new Set(saved.groups || [])};
  } catch {
    return {folders: new Set(), groups: new Set()};
  }
}

function saveOpen() {
  try {
    localStorage.setItem(OPEN_KEY, JSON.stringify({folders: [...opened.folders], groups: [...opened.groups]}));
  } catch {
    // The open rows then last until the page closes.
  }
}

// Drop each kept key whose folder or repository is gone, so the store holds only rows the data still has.
function forgetGone() {
  const before = opened.folders.size + opened.groups.size;
  if (data) {
    const known = knownFolders(data.drives, opened.folders);
    for (const path of opened.folders) if (!known.has(path)) opened.folders.delete(path);
  }
  if (slotReport) {
    const repositories = new Set(slotReport.groups.map(group => group.repository));
    for (const repository of opened.groups) if (!repositories.has(repository)) opened.groups.delete(repository);
  }
  if (opened.folders.size + opened.groups.size !== before) saveOpen();
}

function toggleOpen(set, key) {
  if (!set.delete(key)) set.add(key);
  saveOpen();
}

function headHtml(drive) {
  const name = settings.names[drive.mount];
  const title = name ? `${esc(name)}<span class="path">${esc(drive.mount)}</span>` : esc(drive.mount);
  const free = drive.total ? `<span class="free">${size(drive.free)} free <small>of ${size(drive.total)}</small></span>` : "";
  let html = `<div class="head"><h2>${title}</h2>${free}</div>`;
  if (drive.total) {
    const mark = drive.floor == null ? "" : `<div class="floor" style="left:${(100 * (drive.total - drive.floor) / drive.total).toFixed(2)}%"></div>`;
    html += `<div class="bar"><div class="used" style="width:${(100 * drive.used / drive.total).toFixed(2)}%"></div>${mark}</div>`
      + `<p class="note">${drive.floor == null ? "" : '<span class="mark"></span>'}${floorNote(drive)}</p>`;
  }
  return html;
}

// A row that opens and closes answers a click, Enter and space.
function onToggle(root, selector, toggle) {
  root.addEventListener("click", event => {
    const row = event.target.closest(selector);
    if (row) toggle(row);
  });
  root.addEventListener("keydown", event => {
    const row = event.target.closest(selector);
    if (row && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); toggle(row); }
  });
}

// Write a part's rows again; the row that held the focus keeps it.
function refill(part, attribute, html) {
  const focused = part.contains(document.activeElement) ? document.activeElement.closest(`[${attribute}]`)?.getAttribute(attribute) : null;
  part.innerHTML = html;
  if (focused != null) part.querySelector(`[${attribute}="${CSS.escape(focused)}"]`)?.focus();
}

// A drive card is built once and kept across new data. A slider step, a toggle or new data changes only the head,
// the slider ends, the value and the rows, so a drag and the focus go on.
function driveView(card) {
  let drive = null, range = null, state = null, slider = null;
  const fill = () => {
    card.querySelector("output").textContent = size(state.limit);
    refill(card.querySelector("tbody"), "data-path",
           treeRows(drive.tree, drive.mount, state, data.keep_bytes).map(row => rowHtml(row, drive.tree.size)).join(""));
  };
  const build = () => {
    // A div, not a label: a label around the slider can take the press that starts a drag.
    card.innerHTML = `<div class="top"></div><div class="limit">Name top folders of at least<span class="range">`
      + `<span class="end low"></span><input type="range" min="0" max="${SLIDER_STEPS}" aria-label="Name top folders of at least">`
      + `<span class="end high"></span><output></output></span></div>`
      + `<table class="tree"><colgroup><col class="place"><col class="size"><col class="pct"><col class="walk"></colgroup>`
      + `<thead><tr><th>Place</th><th class="n">Size</th><th class="n pct">Of parent</th><th aria-label="Place in the drive"></th></tr></thead>`
      + `<tbody></tbody></table>`;
    slider = card.querySelector("input");
    slider.addEventListener("input", () => {
      state.limit = fromSlider(Number(slider.value), range);
      fill();
    });
    onToggle(card.querySelector("tbody"), "tr[data-path]", row => {
      toggleOpen(state.opened, row.dataset.path);
      fill();
    });
  };
  return next => {
    drive = next;
    if (!drive.tree) {
      card.innerHTML = headHtml(drive) + `<p class="problem">No folder sizes: ${esc(drive.error || "the measure gave no folders")}.</p>`;
      slider = null;
      return;
    }
    if (!slider) build();
    range = sliderRange(drive.tree, settings);
    state = stateFor(drive, range);
    card.querySelector(".top").innerHTML = headHtml(drive);
    card.querySelector(".end.low").textContent = size(range.min);
    card.querySelector(".end.high").textContent = size(range.max);
    slider.disabled = range.max <= range.min;
    const position = String(toSlider(state.limit, range));
    if (slider.value !== position) slider.value = position;
    fill();
  };
}

function renderStatus() {
  const now = Date.now() / 1000, dot = document.getElementById("dot");
  dot.hidden = !data;
  if (data) dot.classList.toggle("old", now - data.measured_at > settings.cache_seconds);
  document.getElementById("status").textContent =
    statusText(data ? data.measured_at : null, now, Boolean(measuring), problem, settings.cache_seconds);
}

function renderSlots() {
  const card = document.getElementById("slots");
  card.hidden = !slotReport;
  if (slotReport) refill(card, "data-group", slotsHtml(slotReport, data ? data.keep_bytes : 0, Date.now() / 1000, opened.groups));
}

function renderCards() {
  forgetGone();
  renderSlots();
  const card = document.getElementById("sessions");
  card.hidden = !sessionReport;
  if (sessionReport) card.innerHTML = sessionsHtml(sessionReport, data ? data.keep_bytes : 0, settings.sessions_shown);
}

// New data keeps each drive card, so a refresh does not end a drag; a changed drive list builds the cards again.
function render() {
  const grid = document.getElementById("drives");
  if (data.drives.map(drive => drive.mount).join("\n") !== [...driveViews.keys()].join("\n")) {
    driveViews.clear();
    grid.replaceChildren(...data.drives.map(drive => {
      const card = document.createElement("section");
      card.className = "card";
      driveViews.set(drive.mount, driveView(card));
      return card;
    }));
  }
  for (const drive of data.drives) driveViews.get(drive.mount)(drive);
  renderCards();
  renderStatus();
}

async function readData() {
  const response = await fetch(DATA_FILE + "?" + Date.now(), {cache: "no-store"});
  if (response.status === 404) return null;
  if (!response.ok) throw new Error(`the server answered ${response.status}`);
  return response.json();
}

function show(next) {
  data = next;
  if (data) render(); else { renderCards(); renderStatus(); }
}

// Ask the server for a measure and the slots and sessions in use now. The server starts a measure only when the sizes
// are old. The page keeps the old sizes and reads the data file again until it changes.
async function askMeasure() {
  try {
    const response = await fetch(MEASURE, {method: "POST", body: "",
                                           headers: {"Content-Type": "application/x-www-form-urlencoded"}});
    const answer = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(answer.reason || `the server answered ${response.status}`);
    slotReport = answer.slots || null;
    sessionReport = answer.sessions || null;
    if (answer.state === "current") {
      // The page's sizes are old only when another measure finished since the page read them.
      show(!data || Date.now() / 1000 - data.measured_at >= settings.cache_seconds ? await readData() : data);
      return;
    }
    renderCards();
    measuring = {since: Date.now() / 1000, before: data ? data.measured_at : null};
    setTimeout(poll, settings.poll_seconds * 1000);
  } catch (error) {
    problem = `The page could not start a measure: ${error.message}.`;
  }
  renderStatus();
}

async function poll() {
  try {
    const next = await readData();
    if (next && next.measured_at !== measuring.before) {
      // A new measure gives new slot and session sizes, so the page asks once more; the server answers "current".
      measuring = null;
      show(next);
      await askMeasure();
      return;
    }
  } catch (error) {
    // A failed read leaves the measure running; the next read tries again.
  }
  if (Date.now() / 1000 - measuring.since > settings.wait_seconds) {
    measuring = null;
    problem = "The measure did not finish.";
    renderStatus();
    return;
  }
  setTimeout(poll, settings.poll_seconds * 1000);
}

async function start() {
  try {
    data = await readData();
  } catch (error) {
    document.getElementById("status").textContent = `No sizes: ${error.message}.`;
    return;
  }
  show(data);
  await askMeasure();
}

onToggle(document.getElementById("slots"), "tr[data-group]", row => {
  toggleOpen(opened.groups, row.dataset.group);
  renderSlots();
});
start();
setInterval(renderStatus, 30000);
</script>
</body>
</html>
