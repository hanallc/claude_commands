# Step names. Readers use the current values.
[names]
names.gate=gate
# Gate jobs, read from the command's arguments (build_steps.command_job).
names.integrate=integrate
names.test-all=test all
names.test-modules=test named
names.test-affected=test affected
names.test-nightly=test nightly
names.fast-track=fast track
names.toolchain-trial=toolchain trial
names.promote=promote
names.ci=CI

[prose]
prose.gate=the gate
prose.build=release build

[owned]
owned.default={unit} {step}
owned.showrunner-default=showrunner {step}
owned.ci-default=CI {step}

# Use one description per step. Use {branch} and {modules} for the recorded branch and module count.
[about]
about.integrate=Merges the checkpoint into the {branch} branch, runs every test module, then pushes {branch}
about.test-all=Runs every test module
about.test-modules=Runs {modules} named test modules
about.test-affected=Runs the test modules that the change affects
about.test-nightly=Tests the {branch} branch each night and records a red result with its owner
about.promote=Publishes the {branch} branch to main and the Mac
about.gate-job=Runs a merge or test job

about.verify-check=Checks that the libraries and binaries compile
about.verify-test=Runs the selected tests
about.verify-lint=Checks the code and formatting
about.verify-doc=Builds documentation from the staged code
about.verify-final=Checks the workspace targets and runs the selected tests
about.verify-build=Builds the selected binaries
about.verify-example=Checks the selected examples

about.ci=Runs the CI builds and tests
about.ci-bench=Runs the selected benchmarks for CI
about.ci-nextest=Runs the selected tests for CI

about.cargo=Runs a Cargo step
about.cargo-build=Builds the selected targets
about.cargo-check=Checks that the selected targets compile
about.cargo-clippy=Checks the code for problems
about.cargo-test=Runs the selected tests
about.cargo-nextest=Runs the selected tests
about.cargo-run=Builds and runs the selected program
about.cargo-bench=Runs the selected benchmarks
about.cargo-doc=Builds documentation
about.cargo-rustc=Compiles the selected code
about.cargo-rustdoc=Builds documentation
about.cargo-fix=Applies compiler fixes
about.cargo-install=Builds and installs the selected program
about.cargo-miri=Checks the selected tests for memory errors
about.cargo-mend=Checks the code style
about.cargo-fmt=Formats the Rust code

about.compiler-cache=This cache stores compiled code for reuse
about.unowned-processes=These processes run outside the queue
about.codex-servers=These processes serve Codex sessions
about.repository-slot=Waits for a build slot
about.between-steps=Holds memory between build steps
about.mac-unavailable=The Mac memory reading is not available
about.build-step=Runs a build step

# What each gate job changes.
[changes]
changes.integrate={branch} branch
changes.promote=main branch
changes.default=no branch
