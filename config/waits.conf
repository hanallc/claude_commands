# Wait limits: how long a tool waits for something before it stops and reports the problem.
# Every tool that waits takes its time from this file. No tool has its own wait number.
# A tool uses one kind below, or one size from the size list.

[kinds]

# Wait for a list that a second tool changes at the same time.
# Example: two sessions start together. One session waits while the other adds itself to the session list.
# whole: 1..
lock.seconds=30

# Wait for the answer to one short question to the second machine or to a web service.
# Example: a session asks the Mac which accounts are logged in.
# whole: 1..
network_call.seconds=30

# After a tool tells a program to stop, wait this long. Then close the program by force.
# Example: the build queue tells a build to stop. If the build is still running after 5 seconds, the queue closes it.
# whole: 1..
stop_grace.seconds=5

# When a job shows no progress for this long, send one alert. The job continues.
# Example: the build queue cannot read the free memory, so it cannot start builds. It sends an alert after 5 minutes.
# whole: 1..
stall_alert.minutes=5

[sizes]
# A command or a job uses the shortest size that is longer than its slowest normal run.

# 8 seconds: a fast read.
# Example: read the history of a branch.
# whole: 1..
size.fast.seconds=8

# 30 seconds: a short check.
# Example: read how much use is left on an account.
# whole: 1..
size.short.seconds=30

# 2 minutes.
# Example: check that a Claude account can still log in.
# whole: 1..
size.standard.seconds=120

# 5 minutes.
# Example: a worker makes its conversation shorter, so that it can continue work.
# whole: 1..
size.medium.seconds=300

# 15 minutes.
# Example: check that the developer tools of a project load correctly.
# whole: 1..
size.long.seconds=900

# 30 minutes.
# Example: one group of tests in a test run.
# whole: 1..
size.extended.seconds=1800

# 2 hours.
# Example: a full test run on the Mac Linux machine.
# whole: 1..
size.maximum.seconds=7200

[own]
# A wait that does not fit a size keeps its own line. The line above it gives the reason.

# Keep this read within the feed pass interval (interval_seconds=3 in config/memory_feed.conf).
# At the limit, the Tokens group shows "Status: unavailable".
# range: 5e-324..
stevie_pool.seconds=0.5
