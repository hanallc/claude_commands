# MemoryTracePolicy checks the range of each setting.

# Read program memory at this interval in seconds.
# whole: ..
sample.seconds=2

# Stop sampling after this many readings for one run.
# whole: ..
sample.max_per_run=4096

# Limit the file size for one run, including its final record.
# whole: ..
sample.max_bytes_per_run=262144

# Show past runs on the chart up to this age in days.
# whole: ..
feed.past_run_max_age_days=7

# Keep at most this many chart points per phase and run.
# whole: ..
feed.points_per_phase=128

# Limit the total size of trace fields in one feed reading.
# whole: ..
feed.bytes_per_refresh=65536

# Read at most this many unread log bytes before sealing a trace.
# whole: ..
seal.replay_bytes=262144

# Wait this many seconds for release after the scope disappears.
# whole: ..
seal.scope_loss_grace_seconds=4

# Retry a failed seal at most this many times after the first attempt.
# whole: ..
seal.retry_count=2

# Queue at most this many commands for grants, reserves, and releases.
# whole: ..
worker.max_pending_commands=64

# Wait at most this many seconds for the trace worker to stop.
# whole: ..
worker.shutdown_timeout_seconds=1
