# Read program memory at this interval in seconds.
# whole: 1..60
sample_seconds=2

# Stop sampling after this many readings for one run.
# whole: 1..65536
max_samples_per_run=4096

# Limit the file size for one run, including its final record.
# whole: 1024..4194304
max_bytes_per_run=262144

# Remove finished and abandoned traces after this many days.
# whole: 1..90
retention_days=7

# Keep at most this many finished traces across all shapes.
# whole: 1..4096
max_finished_runs=1024

# Keep at most this many chart points per phase and run.
# whole: 3..4096
points_per_phase=128

# Limit the total size of trace fields in one feed reading.
# whole: 1024..1048576
feed_bytes_per_refresh=65536
