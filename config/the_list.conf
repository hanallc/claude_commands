# Maximum characters in the latest status.
# whole: 1..
max_chars.latest_status=200

# Maximum characters in the next step.
# whole: 1..
max_chars.next_step=160

# Maximum characters in each new evidence line.
# whole: 1..
max_chars.evidence_line=300

# Maximum runs in one repeat series. Unit: runs. Default: 730.
# whole: 1..
series_run_limit=730

# Time for the owner to confirm a scheduled run. Unit: minutes. Default: 15.
# whole: 1..
confirm_wait_minutes=15
