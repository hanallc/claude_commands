# Keep Hana placement inactive until the later activation decision.
enabled=on
# Use signed control for the inactive Linux target.
execution_transport=hana-control
# Use this alias in queue and execution reports.
host=aws-hana
# Permit only this normalized repository identity.
repository_identity=https://github.com/natepiano/hana
# Permit judgments without repair or build commands.
kinds=check,lint
# Permit one assigned step across all worktrees.
# whole: 1..1
max_steps=1
# Require this free space before guest execution.
# whole: 1..
free_floor_gib=30
# Stop a boot that receives no fresh work permit within this interval.
# whole: 1..60
guard_grace_seconds=60
# Check the permit independently of the controller and command.
# whole: 1..60
watchdog_check_seconds=1
# Bound one renewal window; Phase C renews permission for longer steps.
# whole: 1..1800
permit_max_seconds=1800
# Bound all Hana command CPU use to this many vCPUs.
# whole: 1..8
step_cpu_limit=4
# Bound all Hana command memory use, leaving room for the guest services.
# whole: 1..24
step_memory_gib=24
# Bound device discovery and the data mount operation.
# whole: 1..60
mount_timeout_seconds=15
# Use the Ohio region for the kept box and its storage.
region=us-east-2
# Provide 64 GiB of memory for the bounded Hana command.
instance_type=m7a.4xlarge
# Try these other instance types when setup cannot launch the first choice.
fallback_instance_types=c7a.4xlarge,m7i.4xlarge,m6a.4xlarge
# Reserve compute at this bid ceiling.
# range: 0.001..
spot_max_usd_per_hour=0.35
# Add this fraction of the current Spot price when setup suggests a new ceiling.
# range: 5e-324..
spot_ceiling_margin=0.25
# Retain the root volume while the box exists.
# whole: 1..
root_gib=40
# Retain source and build folders on the data volume.
# whole: 1..
data_gib=300
# Bound Hana spending within the unchanged account limit.
# range: 0.01..
daily_budget_usd=6
# Refresh the placement preview after two seconds so time-based limits stay current.
# whole: 1..5
preview_max_age_s=2
# Estimate standard gp3 storage with a 30-day month.
# range: 0.001..
gp3_usd_per_gib_month=0.08
# Retain short work bursts before a deliberate idle stop.
# whole: 1..
idle_stop_seconds=600
# Bound caller waiting without releasing an unresolved start claim.
# whole: 1..
start_timeout_seconds=120
# Reconcile lifecycle state before the independent guest guard expires.
# whole: 1..
tick_interval_s=5
# Bound one supervisor child, including failed provider calls.
# whole: 1..
controller_tick_timeout_s=45
# Keep Hana resources separate from the gate stack.
stack_name=hana-build
# Keep the retained data disk in one availability zone.
availability_zone=us-east-2c
# Require the reviewed Hana safety image before preparation; empty uses the hana-image record.
ami_id=
# Require the owner of the reviewed Hana safety image; empty uses the hana-image record.
ami_owner_id=
# Require an explicit VPC for the separate Hana stack; empty uses the hana-image record.
vpc_id=
# Require a public subnet in the retained disk zone; empty uses the hana-image record.
subnet_id=
# Bound small requests to AWS and signed control requests.
# whole: 1..
aws_timeout_s=10
# Limit the setup wait for the Hana box to stop, in seconds.
# whole: 1..
stop_wait_timeout_s=600
# Set the interval between setup checks of the Hana box state, in seconds.
# whole: 1..
stop_poll_seconds=10
# Limit the search for pending Hana resources during teardown, in seconds.
# whole: 1..
intent_lookup_timeout_s=120
# Build coldsnap from the NixOS pin that builds the Hana image; hana-image uploads the image with it.
image_upload_tool=/etc/nixos#nixosConfigurations.aws-hana.pkgs.coldsnap
# Bound each image conversion, snapshot upload, snapshot wait, and image registration wait.
# whole: 60..
image_upload_timeout_s=3600
# Set the minimum interval between snapshot checks in seconds.
# whole: 1..60
image_wait_interval_s=10
# Bound signed control access for one boot.
# whole: 1..604800
control_url_seconds=3600
# Read the current control object before the guest watchdog interval ends.
# whole: 1..
control_poll_seconds=1
# Permit these ignored paths without sending their contents.
source_allowed_ignored=target/ .direnv/ __pycache__/ **/__pycache__/ .claude/settings.local.json
# Refuse credential paths even when Git does not ignore them.
source_forbidden_paths=.claude/settings.local.json .direnv/ .aws/ .env .env.* **/.env **/.env.* *.pem **/*.pem *.key **/*.key
# Permit only these caller environment variables in a source manifest.
source_allowed_environment=RUSTFLAGS RUSTDOCFLAGS CARGO_INCREMENTAL RUST_BACKTRACE
# Bound one source bundle download and its stored upload.
# whole: 1..
source_max_bytes=1073741824
# Bound each source download operation in seconds.
# whole: 1..
source_download_timeout_s=120
# Bound the upload of one source bundle in seconds. The provider request limit (aws_timeout_s) is too short:
# the first real Hana bundle did not upload from natedev in 10 s. The home uplink is slower than the
# download path of the box, so this limit is larger than source_download_timeout_s.
# whole: 1..
source_upload_timeout_s=300
# Allow time to transfer a result with up to 32 MiB of compiler output and metadata.
# whole: 1..
result_transfer_timeout_s=120
# Bound each source Git operation in seconds.
# whole: 1..
source_git_timeout_s=60
# Bound signed source access for one request.
# whole: 1..604800
source_url_seconds=3600
# Bound the acknowledged commits retained for each repository.
# whole: 1..
source_basis_max_commits=8
# Use Hana's existing Linux CI shell selection.
execution_shell=ci
