# All page status limits use seconds. Each range includes both endpoints.
# Mark the round trip time as slow above this limit.
# range: 0.001..86400
status.round_trip_limit_seconds=1

# Mark the server render time as slow above this limit.
# range: 0.001..86400
status.render_limit_seconds=1

# Wait this long before showing Reading during a refresh. Show Reading at once when no data is available.
# range: 0.001..86400
status.reading_delay_seconds=1

# status.<page>.age_limit_seconds sets the age limit for each page.
# Show Late when the whole seconds since the last server answer exceed the limit.
# Use the last data read time when a separate server answer time is unavailable.
# A hidden or held page shows Paused, and a failed read shows Failed, before Late.
# A busy page, such as Disks during a measurement, shows Late after the limit.
# range: 0.001..86400
status.accounts.age_limit_seconds=45

# range: 0.001..86400
status.aws.age_limit_seconds=3900

# range: 0.001..86400
status.aws_machines.age_limit_seconds=3900

# range: 0.001..86400
status.builds.age_limit_seconds=15

# range: 0.001..86400
status.disks.age_limit_seconds=600

# range: 0.001..86400
status.images.age_limit_seconds=45

# range: 0.001..86400
status.list.age_limit_seconds=45

# range: 0.001..86400
status.review.age_limit_seconds=45
