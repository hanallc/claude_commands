# Entries appear in file order. AWS Machines follows AWS.
# page.<page>.label sets the text in the console navigation. Use nonempty text.
# page.<page>.icon selects the icon next to the label.
# Use a Lucide name from ICON_NAMES in scripts/review_links/console.py.
# page.<page>.title sets the browser tab text and the page frame's title. Use nonempty text.
# For URL and items functions, use python:<module>:<function>.
# A URL function takes no arguments.
# Return a path under the review root that starts with one slash.
# You can also return a full HTTP URL on the configured review origin.
# An optional items function takes a NewsRequest and returns a frozenset of waiting item IDs.
# The navigation marks an inactive page as new when it has a waiting item absent from the last saved set.
# The first read and each read while the page is open replace that set.
# page.<page>.owner selects the recipient for new items. Use an active showrunner or producer staff ID.
# The List owner choice in the New item dialog uses the producer from page.list.owner.
