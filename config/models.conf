# Model settings for the agent launchers.
# Each assignment selects claude or codex. The matching family section must exist.
# A task assignment overrides the assignment for its function.
# In a launch section, use model or model:effort.
# Use a model from the family catalog, or a Codex alias from [codex.families].
# Use an effort from that model's catalog row. Omit the colon and effort to use the CLI default.
# The sync_codex_catalog.sh script generates the Codex catalog and aliases.
# Maintain the Claude catalog and aliases by hand.

[assignments]
# Family for unit worker passes.
direct=codex

# Family for the daily simplify review.
direct.simplify=claude

# Family for CLI aliases.
cli=codex

# Family for new unit directors. The launcher requires claude.
production=claude

# Family for the held designer and reviewer. Only the Codex section is configured.
design_roles=codex

[producer_defaults]
# Launch defaults when agents add-producer omits a family, model, or effort.
# Use family:model:effort. Use claude or codex and a model and effort from its catalog.
model=claude:fable:high

# Each key is a producer name. Set its launch profile as family:model:effort.
# Use the same format and allowed values as producer_defaults.model.
[producers]
morty=claude:fable:high
brain=claude:fable:high
dwight=claude:fable:high
bob=claude:fable:high

[compact_windows]
# Set the Claude auto-compact window for producer, showrunner, unit, or worker.
# Use auto or a token count from 100k to 1M. An absent key uses settings.json.
producer=300000

# Model and effort for a new Claude unit director and child showrunner.
[production.claude]
director=opus:xhigh
showrunner=opus:high

[production.codex]
# Set-model stores the Codex defaults for director and showrunner here.
# New unit directors and showrunners start on Claude.

# Model and effort for each held design role.
[design_roles.codex]
designer=astra:xhigh
reviewer=astra:xhigh

# Model and effort for each unit worker pass.
# impl implements changes. test checks changes. fix repairs findings. review finds issues.
[direct.codex]
impl=sol:high
test=sol:high
fix=sol:high
review=sol:high

[direct.claude]
# Model and effort for the daily simplify review. The other rows set worker passes.
simplify=opus:high
impl=opus:high
test=opus:high
fix=opus:high
review=opus:xhigh

# Claude account for the simplify review. Use caller for the current account.
# Use workers for the worker accounts. The default is workers.
[direct.options]
claude_account.simplify=caller

# Model and effort per CLI task. merge_branch runs the merge task.
# interactive starts a terminal agent session.
[cli.codex]
merge_branch=luna:high        # alias: merge
interactive=sol:high         # alias: code (REPL)

[cli.claude]
merge_branch=sonnet:high
interactive=opus:max

# The model check of a hand made command (scripts/production/hand_made.py).
# The shared launcher does not read this section.
[cli.hand_made]
# Model and effort of the check, as model:effort.
claude.model=opus:high

# Role whose account runs the check: units, showrunners or producers.
claude.role=units

# Seconds that one check call can take before the run is refused.
# range: 5e-324..
check_time_limit_seconds=90

# Largest sum of program file bytes that the check reads; more is refused.
# whole: 1..
max_script_bytes=65536

# Each catalog row maps a model to its allowed effort names, separated by commas.
# Each [codex.families] alias value is a generated model ID.
# Launch uses the alias key to select the newest visible model in both the Codex cache and [codex.agents].
# Alias resolution fails if the cache is unavailable or no model matches.
[codex.agents]
# Generated by scripts/agents/sync_codex_catalog.sh — do not hand-edit.
gpt-6.1-sol=low,medium,high,xhigh,max,ultra
gpt-6-astra=low,medium,high,xhigh,max,ultra
gpt-6.1-terra=low,medium,high,xhigh,max,ultra
gpt-6-sol=low,medium,high,xhigh,max,ultra
gpt-6-luna=low,medium,high,xhigh,max
gpt-5.6-sol=low,medium,high,xhigh,max,ultra
gpt-5.6-terra=low,medium,high,xhigh,max,ultra
gpt-5.6-luna=low,medium,high,xhigh,max

gpt-6.2-sol=low,medium,high,xhigh,max,ultra
gpt-6.2-astra=low,medium,high,xhigh,max,ultra

[codex.families]
# Generated by scripts/agents/sync_codex_catalog.sh — do not hand-edit.
astra=gpt-6.2-astra
luna=gpt-6-luna
sol=gpt-6.2-sol
terra=gpt-6.1-terra

[claude.agents]
# Use a Claude CLI model name and its allowed effort names, separated by commas.
fable=low,medium,high,xhigh,max
opus=low,medium,high,xhigh,max
sonnet=low,medium,high,xhigh,max
haiku=low,medium,high,xhigh,max

# Each row maps a Claude alias to a fallback model name or ID the CLI accepts.
# The launch account can supply a different model ID for that alias.
[claude.families]
fable=fable
opus=opus
sonnet=sonnet
haiku=haiku

# The context hook uses these windows to compute its warning thresholds.
# The initial windows came from the Claude CLI 2.1.259 model table.
# The default applies when no family and version rule matches.
# The hook uses 200,000 tokens if the default is missing or the parser skips it.
# For a family, use minimum_version:window. Use a major or major.minor version.
# Use a finite positive window in tokens. k means 1,000 tokens and m means 1,000,000 tokens.
# A bare number below 10,000 counts thousands of tokens.
# The hook skips invalid windows, including infinity and values that overflow.
[claude.context]
default=200k
sonnet=5:1m
opus=4.7:1m
fable=5:1m
mythos=5:1m
