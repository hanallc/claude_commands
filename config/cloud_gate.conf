# Set this to off to run gates and affected tests on natedev.
# The Hana route uses separate keys.
# one of: on, off
enabled=on
# List deployed regions, with the home region first.
regions=us-east-2 us-west-2 eu-north-1 eu-south-2 us-east-1 us-west-1 eu-south-1 ca-central-1 sa-east-1 eu-west-1 eu-west-2 eu-west-3 eu-central-1 ap-south-1 ap-northeast-1 ap-northeast-2 ap-northeast-3 ap-southeast-1 ap-southeast-2
# Read Spot prices in these candidate regions; quota requests use only regions.
spot_candidate_regions=us-east-2 us-west-2 eu-north-1 eu-south-2 us-east-1 us-west-1 eu-south-1 ca-central-1 sa-east-1 eu-west-1 eu-west-2 eu-west-3 eu-central-1 ap-south-1 ap-northeast-1 ap-northeast-2 ap-northeast-3 ap-southeast-1 ap-southeast-2
# Request 136 Standard Spot vCPUs in each configured gate region.
# whole: 1..10000000000
spot_quota_request_vcpus=136
# Request enough G and VT Spot vCPUs for one GPU box up to 8xlarge.
# whole: 1..10000000000
gpu_spot_quota_request_vcpus=32
# Bound the complete GPU trial, including failed boxes.
# range: 0.01..6
gpu_size_trial_limit_usd=6
# Include setup, reboot, tests, and result delivery in each box lifetime.
# whole: 1..60
gpu_size_trial_lifetime_minutes=60
# Estimate room for the driver, runtime, archive extraction, and two test runs.
# whole: 1..500
gpu_size_trial_root_gib=100
# Reserve disk, IPv4, LIST, and transfer costs for each box.
# range: 0..1
gpu_size_trial_box_extra_usd=0.05
# Set the interval between GPU result checks.
# whole: 1..60
gpu_size_trial_result_poll_s=10
# Bound retries of denied GPU launch DryRuns after setup updates the policy.
# whole: 1..300
gpu_setup_dry_run_retry_timeout_s=60
# Set the pause between denied GPU launch DryRuns.
# whole: 1..60
gpu_setup_dry_run_retry_interval_s=5
# Estimate the cost of 1,000 S3 LIST requests in USD.
# range: 0..1
gpu_size_trial_s3_list_usd_per_1000=0.005
# Set gp3 USD per GiB-month for snapshot regions with a different rate.
# Other regions use gp3_usd_per_gib_month from hana_aws.conf.
# https://aws.amazon.com/ebs/pricing/
gpu_size_trial_gp3_usd_per_gib_month_by_region={"ap-northeast-1":0.096,"ap-northeast-2":0.0912,"ap-northeast-3":0.096,"ap-south-1":0.0912,"ap-southeast-1":0.096,"ap-southeast-2":0.096,"ca-central-1":0.088,"eu-central-1":0.0952,"eu-north-1":0.0836,"eu-south-1":0.0924,"eu-south-2":0.088,"eu-west-1":0.088,"eu-west-2":0.0928,"eu-west-3":0.0928,"sa-east-1":0.152,"us-west-1":0.096}
# Use these types in this order. Each JSON price must be greater than zero and at most 10 USD/hour.
gpu_size_trial_spot_max_usd_per_hour={"g6.xlarge":0.81,"g6.2xlarge":0.98,"g6.4xlarge":1.32,"g6.8xlarge":2.01,"g4dn.xlarge":0.53}
# Read Spot prices for these GPU types.
gpu_instance_types=g6.xlarge g4dn.xlarge g4ad.xlarge g5.xlarge
# Choose the cheapest live offer for one Hana nextest run.
# Enable the pinned route after gate setup passes its GPU probe.
execution_transport=hana-gpu
hana_gpu_route_enabled=on
# The Hana placement adapter reads this URL to allow the hanallc/hana repository to use the Hana GPU route.
hana_gpu_repository=https://github.com/hanallc/hana
# Each selection has the form package:integration_test.
hana_gpu_selections=hana_mimesis_tools:shader_variants
# Requires a space-separated list of permitted types for Hana nextest. Use g4dn, g5, g6, or g6e types with at least 8 vCPUs.
# Placement refuses if any listed type lacks a grant. Each type used in a run needs a price cap.
hana_gpu_instance_types=g4dn.2xlarge g6.2xlarge
# Requires a nonempty JSON map from Hana GPU types to Spot caps above 0 and at most 10 USD per hour.
hana_gpu_spot_max_usd_per_hour={"g4dn.2xlarge":0.75,"g6.2xlarge":0.98,"g6.4xlarge":1.32,"g6.8xlarge":2.01}
# Set the guest lifetime for boot, build, tests, and result upload.
# Reserve 67 more minutes for the expiry job, function error retries, and delivery margin.
# whole: 10..120
hana_gpu_lifetime_minutes=90
# Try recently refused capacity only after the other variants.
# whole: 1..86400
capacity_cooldown_seconds=1800
# Median transfer bytes cost $0.00014215344 at $0.02 per GB; round upward.
# range: 0..1
remote_region_transfer_usd=0.00015
# Map far regions to their transfer USD per gate as JSON; other regions use remote_region_transfer_usd.
# Each is about 10 MB per gate (the 2026-11-14 bill) at the region's inter-region transfer price.
region_transfer_usd={"ca-central-1":0.0002,"sa-east-1":0.0014,"eu-west-1":0.0002,"eu-west-2":0.0002,"eu-west-3":0.0002,"eu-central-1":0.0002,"ap-south-1":0.0009,"ap-northeast-1":0.0009,"ap-northeast-2":0.0008,"ap-northeast-3":0.0009,"ap-southeast-1":0.0009,"ap-southeast-2":0.001}
# Bound all parallel Spot price reads before a new launch.
# range: 0.01..30
spot_price_live_read_timeout_s=3
# Price each extra minute of regional gate delay after the delay trial review.
# range: 0..100
gate_wait_usd_per_minute=0
# Requires a JSON map from region names to extra wait seconds for gate ranking.
# Use a finite number, 0 or more, for each region. An absent region adds zero seconds.
region_extra_gate_seconds={}
# Requires a JSON map from region names to extra box seconds when timing from that region is unavailable.
# Use a finite number, 0 or more, for each region. An absent region adds zero seconds.
unmeasured_region_extra_seconds={"eu-south-1":15,"eu-west-1":15,"eu-west-2":15,"eu-west-3":15,"eu-central-1":15,"ca-central-1":10,"sa-east-1":30,"ap-south-1":30,"ap-northeast-1":30,"ap-northeast-2":30,"ap-northeast-3":30,"ap-southeast-1":30,"ap-southeast-2":30}
# Spot types the gate may launch. Price per run picks the type; this order only breaks an exact price tie.
instance_types=c7a.4xlarge c7a.8xlarge m7a.4xlarge m7a.8xlarge
# Read Spot prices for these types too, so the AWS page can compare their cost per run.
price_compare_instance_types=m7a.4xlarge m7a.8xlarge
# The box clones public history before it fetches the incremental bundle.
clone_url=https://github.com/natepiano/claude_commands.git
# Prefix for temporary branches that paired trials push and delete.
trial_branch_prefix=aws-trial
# Bound network Git calls so stalled connections cannot block trial cleanup.
# range: 0.01..300
git_network_timeout_s=60
# Limit one paired trial to nine test modules. The trial uses one gate per module.
# The queue limits concurrent cloud gates with cloud_gate_slots=16 in build_admission.conf.
# whole: 1..9
slots=9
# Maximum charged lifetime, including preparation and result delivery.
# whole: 1..60
lifetime_minutes=20
# Placement does not try a type and region whose median gate time, boot included, is above this.
# whole: 1..60
max_gate_minutes=12
# Requires the gate root volume size in GiB.
# whole: 1..500
root_gib=40
# Requires the Spot bid ceiling in USD per hour for a gate. The ledger uses this rate to reserve funds.
# range: 0.01..10
spot_max_usd_per_hour=0.8
# Include root storage, public IPv4, and object transfers in each reservation.
# range: 0..1
attempt_allowance_usd=0.02
# Requires the interval in seconds between guest log uploads.
# range: 1..60
log_push_s=5
# Requires the interval in seconds between gate result checks.
# range: 0.1..60
result_poll_s=2
# Check the instance state at this interval in seconds.
# whole: 2..300
instance_check_s=30
# Keep polling a running box through an AWS outage (could not connect, timeout, 5xx) this long.
# A longer outage ends the cloud try. The value covers one short regional endpoint failure.
# range: 10..1800
observe_outage_s=180
# Repeat an uncertain launch with its saved idempotency token.
# whole: 1..5
launch_reply_tries=2
# Allow two new cloud attempts after confirmed Spot interruptions.
# whole: 0..10
spot_interruption_retries=2
# Allow one new cloud attempt after a box failure.
# whole: 0..5
box_failure_retries=1
# Requires the time limit in seconds for one gate AWS request.
# range: 1..120
api_timeout_s=30
# Requires the cutoff in seconds for starting another gate termination check. A check in progress can finish later.
# range: 1..600
termination_timeout_s=120
# Requires the maximum time in seconds for one test module on a gate.
# range: 1..3600
module_time_limit_s=1800
# Requires the retention time in whole days for gate objects in S3.
# whole: 1..365
artifact_days=7
# CloudWatch accepts the retention periods in the deployment schema.
# whole: 1..365
log_days=7
# Requires the interval in minutes between gate expiry checks.
# whole: 1..60
expiry_schedule_minutes=1
# Requires the time limit in seconds for one gate expiry function call.
# whole: 1..60
expiry_timeout_s=30
# Requires the memory in MiB for the gate expiry function.
# whole: 128..10240
expiry_memory_mib=128
# Price shared object storage, expiry calls, and logs before deployment.
# range: 0..100
shared_usd_per_month=1
# Sets the path to the scaler credentials file. A nonempty AWS_SHARED_CREDENTIALS_FILE overrides this path.
# Without the override, this key requires a nonempty path. Deployment requires a regular file with mode 0600.
credential_file=~/.config/aws-build/credentials
# Use the deployment host's locked nixpkgs revision.
# Include bubblewrap for tests that need a sandbox.
packages=git python3 cargo rustc rustup cargo-nextest uv curl openssh rsync gnupg ripgrep jq gcc pkg-config tmux taplo zsh bash gh sqlite chromium nodejs util-linux bubblewrap
