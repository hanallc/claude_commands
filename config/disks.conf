# The Disks page: the drives it measures and the limits of each measure.

# Publish the page and its data file in this folder under the review root.
output_folder=~/.local/share/review-links/ysbjmg

# Mount points to measure, in page order. A host key overrides the plain key.
drives=/
drives.natedev=/build /

# The name of a drive on its card, as name.<mount point>. A drive with no name shows its mount point.
name./build=Build drive
name./=System drive

# Seconds a measure stays current. The page asks for a new measure after this time.
# whole: 60..86400
cache_seconds=600

# The start value of each drive card's slider, in GiB.
# range: 0..
slider.default_gib=10

# The smallest value of each drive card's slider, in GiB. Keep it at or above measure.keep_bytes.
# range: 0.25..
slider.min_gib=1

# The smallest folder the data keeps, in bytes. Keep it below slider.min_gib.
# whole: 1..
measure.keep_bytes=268435456

# The memory cap of one measure, as a systemd MemoryMax value.
measure.memory_max=2G

# Seconds before the measure of one drive stops.
# whole: 1..
measure.timeout_seconds=1800
