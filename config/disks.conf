# The Disks page: the drives it measures and the limits of each measure.

# Publish the page and its data file in this folder under the review root.
output_folder=~/.local/share/review-links/ysbjmg

# Mount points to measure, in page order. A host key overrides the plain key.
drives=/
drives.natedev=/build /

# The name of a drive on its card, as name.<mount point>. A drive with no name shows its mount point.
name./build=Build drive
name./=System drive

# Seconds a measure stays current. The page asks for a new measure after this time.
# whole: 60..86400
cache_seconds=600

# Seconds between the page's reads of the data file while a measure runs.
# whole: 1..60
page.poll_seconds=5

# The start value of each drive card's slider, in GiB.
# range: 0..
slider.default_gib=10

# The smallest value of each drive card's slider, in GiB. Keep it at or above measure.keep_bytes.
# range: 0.25..
slider.min_gib=1

# The smallest folder the data keeps, in bytes. Keep it below slider.min_gib.
# whole: 1..
measure.keep_bytes=268435456

# The memory cap of each dust walk, as a systemd MemoryMax value.
measure.memory_max=2G

# The dust depth limit. Zero shows only the root; this bound keeps deep folders in the output.
# whole: 1..
measure.max_depth=1000000

# The dust line limit. Zero shows only the root; this bound avoids the terminal height limit.
# whole: 1..
measure.max_lines=1000000

# Seconds before the measure of one drive stops.
# whole: 1..
measure.timeout_seconds=1800

[cleanup]
# Only Nate can approve the manual cleanup list.
# The saved-target pattern under worktrees checks the root and parents up to three levels below it.
# Each listed /build/p-* folder includes its lease and lock files.
cleanup.dead.natedev=/build/p-9om5yz3a, /build/p-_5sb323i, /build/p-f0k3fxl8, /build/p-hlvomrad, /build/p-n_s_43bh, /build/p-nbppoc1y, /build/p-z1w_2_l_, ~/worktrees/gates, /tmp/claude/p34-merge-13b549f57c, ~/port-gate-tree*, ~/.cache/trunk_catalyst/target, ~/.cache/trunk_p175/target, ~/.local/state/tile-deploy31/target, ~/.local/state/tile-deploy-main/target, ~/.local/state/tile-p49/target, ~/.local/state/tile-p43/discovery-red-src/target, ~/rust/.saved-target-*, ~/worktrees/**/.saved-target-*
# The old worktree row includes its lease and lock files beside it.
cleanup.dead.mac=~/tmp/cargo-liner-phase-verify/target, ~/worktrees/claude-prioritize-index-refresh, ~/build/cargo/claude_commands-slot1
cleanup.list_only.natedev=/build/sccache
cleanup.list_only_reason.natedev=shared tool cache
cleanup.list_only.mac=~/build/slot
cleanup.list_only_reason.mac=bob's hand step
