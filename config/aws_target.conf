# Account settings for temporary cloud gates and trials.
# The following instance type prices historical builder costs.
# one of: m7a.4xlarge
instance_type=m7a.4xlarge
# Requires the account home region. Deployment accepts us-east-1 or us-east-2.
region=us-east-2
# Requires the AWS CLI profile name for the scaler credentials.
credentials_profile=build-scaler

# GPU trial tool check limit, in seconds.
# range: 0.001..
gpu_size_trial_preflight_timeout_s=120

# The user sets these two limits. Change each value only on this line. Never raise these values in code.
# range: 0.001..
monthly_limit_usd=400
# range: 0.001..
daily_limit_usd=35
# Requires the action for an account spending limit. Drain refuses new work.
# one of: drain
limit_action=drain
# Requires the fixed cost floor in USD per month. The ledger applies it while the builder remains in inventory and uses zero after removal.
# range: 0.001..
fixed_usd_per_month=76.21
# Requires the historical builder compute rate in USD per hour when fresh Spot evidence is unavailable.
# range: 0.001..
fallback_usd_per_hour=0.483

# Keep this spending reserve below each account cap.
# range: 0.001..
limit_reserve_usd=3

# Requires a zoneinfo time zone, such as UTC, for the day and month boundaries of cost estimates.
accounting_zone=UTC
# Requires the minimum interval in seconds between scheduled Spot price refreshes. Deployment can refresh sooner.
# whole: 1..
price_refresh_seconds=3600
# Requires the maximum age in seconds for Spot price and quota evidence.
# whole: 1..
price_max_age_seconds=7200
# Requires the maximum age in seconds for builder instance state evidence.
# whole: 1..
observation_max_age_seconds=300
# Requires the minimum interval in seconds between scheduled Cost Explorer reads.
# whole: 1..
cost_explorer_interval_seconds=86400
# Apply the equal-read rule to this many completed UTC days.
# whole: 1..
cost_explorer_lookback_days=7
# Read this many completed UTC days to check settled amounts. Use at least the lookback.
# whole: 1..
cost_explorer_watch_days=45
# Require this many consecutive Cost Explorer reads with the same amount after the UTC day ends.
# whole: 1..
cost_explorer_unchanged_reads=2
# Send notices about changes to settled amounts to this session.
cost_explorer_change_recipient=bob
# UTC days in the report's gate type comparison, including the report day.
# whole: 1..
gate_type_window_days=14
# Latest billed UTC days whose average sets the month forecast in the AWS spend report.
# whole: 1..
spend_pace_days=7
# Requires the estimated charge in USD for one Cost Explorer read.
# range: 0..
cost_explorer_read_usd=0.01
# Charge each box for at least one minute.
# whole: 1..3600
box_minimum_seconds=60

# Historical builder estimates include these components once.
# range: 0..
retained_storage_usd_per_month=40
# range: 0..
root_storage_usd_per_month=2.56
# range: 0..
ipv4_usd_per_month=3.65
# range: 0..
gp3_iops_usd_per_month=15
# range: 0..
gp3_throughput_usd_per_month=15

# Requires a destination accepted by the message command for spending limit notices.
notification_recipient=builds
# Requires the time limit in seconds for a spending limit notice.
# whole: 1..
notification_timeout_s=30

# Minimum interval between limit notice attempts, in seconds.
# whole: 1..
notification_retry_s=300

# Bound account and regional price requests.
# range: 0.001..
aws_timeout_s=30

# Limit the redacted reason in each snapshot error to this many characters.
# whole: 1..
snapshot_error_reason_max_chars=240

# Bound delivery of the price notice and the hours gap message, in seconds.
# range: 0.001..
snapshot_notification_timeout_s=120

# deploy.py up reads Spot prices and quotas this many times while IAM shows the new policy.
# whole: 1..
deploy_price_fill_attempts=3

# Seconds between the deploy.py up price reads.
# range: 0..
deploy_price_fill_pause_s=10

# The AWS page measures run times and billed cost per run over this many days.
# whole: 1..
run_cost_days=7

# The hourly snapshot keeps the daily mean lowest zone Spot price of each type and region
# for this many UTC days, so a billed day can be compared with its Spot price.
# whole: 1..
spot_price_days_keep=30

# The hourly snapshot sends one user notice for each gate type, region and UTC day
# whose billed Spot hours differ from the cost ledger's box hours by more than this ratio.
# range: 0..
billed_hours_gap_max_ratio=0.15

# Deployment applies this resource tag. Cost Explorer reads the whole account.
cost_explorer_tag_key=BuildTarget
cost_explorer_tag_value=aws-build

# Deployment stays local until the user runs deploy.py apply.
# Requires the administrator profile name for deployment setup and the check for old plaintext credentials.
deployment_profile=build-admin
# Requires a stack name that starts with an ASCII letter and uses only ASCII letters, digits, or hyphens.
# Use at most 107 characters with the current regions. The name plus -gates-<region> must fit in 128 characters.
stack_name=aws-build
# Requires the ID of an available x86_64 NixOS image that matches the owner, release, and root device.
ami_id=ami-07bfb1e3c271e2e69
# Requires the 12-digit account ID of the owner of the selected NixOS image.
ami_owner_id=427812963091
# Requires the NixOS release text that must occur in the selected image name.
nixos_release=26.05
# Requires the subnet availability zone. Its name must start with the configured region.
availability_zone=us-east-2c
# Requires a path outside the repository to a private file with one Budget email address.
# Use UTF-8 and an address with an at sign and no internal whitespace.
notification_email_file=~/.config/aws-build/notification-email
# Requires the EC2 root device name. It must match the selected image.
root_device_name=/dev/xvda
# Requires the fallback Spot rate in USD per hour for historical builder costs. New gates read cloud_gate.conf.
# range: 0.001..
spot_max_usd_per_hour=0.483
# Requires the first AWS Budget notice threshold in percent of the monthly limit. It must be below the second threshold.
# whole: 1..100
budget_notice_low_percent=50
# Requires the second Budget notice threshold in percent of the monthly limit. Set it between the first and stop thresholds.
# whole: 1..100
budget_notice_high_percent=80
# Requires the AWS Budget threshold in percent of the monthly limit for a notice and the automatic launch block.
# whole: 100..100
budget_stop_percent=100
# Requires the time limit in seconds for an AWS deployment request.
# whole: 1..
deployment_timeout_s=900
# Limit each CloudFormation wait call.
# whole: 1..
stack_wait_timeout_s=3600
# Requires the maximum age in seconds for the saved deployment preflight.
# whole: 1..
preflight_max_age_s=300
# Requires the IAM user name for the scaler.
scaler_user_name=build-scaler
# Retry the new scaler key while IAM publishes its permissions.
# whole: 1..
scaler_key_check_attempts=12
# Wait this many seconds between checks that confirm the new scaler key belongs to its IAM user.
# range: 0.001..
scaler_key_check_delay_s=5

# Encrypt administrator AWS and Tailscale credentials with one terminal passphrase.
admin_secret_file=~/.config/aws-build/admin.gpg
# Bound resource teardown and recovery.
# whole: 60..7200
box_setup_timeout_s=3600
# Set the delay between teardown checks.
# range: 0.001..60
box_check_delay_s=5

# Seconds between deployment progress messages.
# range: 0.001..
deploy_progress_interval_s=60
