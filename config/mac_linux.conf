# List the Mac SSH alias and then the guest SSH alias.
ssh.hops=mac linux-guest
# Log in to the guest with this account.
guest.user=gate-runner
# Run at most this many test modules at one time.
test.jobs=8
# Limit the guest test run to this many seconds.
run.time_limit_seconds=3600
# Compress the source at this Zstandard level.
copy.zstd_level=10
