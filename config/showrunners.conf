# Send low-quota alerts at or below this percentage of remaining quota.
# range: 0..100
threshold_percent=2
# Send a Claude expiry push when the forecast is fewer than this many hours away.
# whole: 1..168
claude_expiry_alert_hours=12
# Count this many hours from the saved attempt time before repeating a Claude expiry push.
# whole: 1..168
claude_expiry_repeat_hours=2
# Minutes of inactivity before stall-watch can send a notice when no work is running.
# range: 0..
stall_minutes=5
# Store the staff id of the fault recipient.
faults_to=96b016bf-87cf-4a19-af7a-77425852c2e2
# Store the staff ids of the standing recipients.
always=96b016bf-87cf-4a19-af7a-77425852c2e2
