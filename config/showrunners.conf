# Send low-quota alerts at or below this percentage of remaining quota.
# range: 0..100
threshold_percent=2
# Send a Claude expiry push when the forecast is fewer than this many hours away.
# whole: 1..168
claude_expiry.alert_hours=12
# Count this many hours from the saved attempt time before repeating a Claude expiry push.
# whole: 1..168
claude_expiry.repeat_hours=2
# Send token end-date reminders this many days before each end date.
token_expiry.lead_days=30 7
# End date of the GitHub token that registers the Hana Linux CI runners.
token_expiry.hana_linux_runners.ends=2027-11-22
# End date of the GitHub token that checks Hana macOS CI runner availability.
token_expiry.hana_macos_runner_query.ends=2027-11-22
# Show this numbered Claude account on the Mac fallback token row.
mac_token.account=claude2
# Primary GPG key fingerprint for Mac fallback token renewal.
mac_token.gpg_recipient=7E1AAF076B73678BCD8FB72C633FE655092420F1
# Minutes of inactivity before stall-watch can send a notice when no work is running.
# range: 0..
stall_minutes=5
# Store the staff id of the fault recipient.
faults_to=96b016bf-87cf-4a19-af7a-77425852c2e2
# Store the staff ids of the standing recipients.
always=96b016bf-87cf-4a19-af7a-77425852c2e2
