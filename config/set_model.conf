# Effort used when the command omits it.
default_effort=high

# Wait this many seconds before each Claude screen read.
# Codex polls at this interval until pane_timeout_seconds.
# Codex uses 0.1 seconds if this setting is zero.
# range: 0..10
screen_wait_seconds=0.25

# Limit the Claude screen reads after each model or effort command.
# whole: 1..10
screen_reads=4

# Limit the time for one pane update in seconds.
# range: 0.1..120
pane_timeout_seconds=30
