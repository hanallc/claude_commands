# Build folder settings. Readers use current values for each allocation.
[names]
# Set the length of random suffixes for unique folder names.
# Use a positive whole number of characters. Default is 8 characters.
# whole: 1..
names.suffix_length=8
# Set how many hexadecimal digits of the SHA-256 identity hash follow the repository name.
# Use 1 to 64 whole characters. Default is 8 characters.
# whole: 1..64
names.repository_key_length=8
# Select the characters that can occur in a random suffix.
# Use a nonempty string of ASCII letters, digits, or underscores.
# Default is abcdefghijklmnopqrstuvwxyz0123456789_.
names.suffix_characters=abcdefghijklmnopqrstuvwxyz0123456789_

[roots]
# Set the short system temporary folder for callers that request it.
# Use a directory path. Default is /tmp.
roots.system=/tmp
# Set the parent of temporary folders made by the build_folders run command.
# Use a directory path. The reader expands variables and ~.
# Default is ${TMPDIR}/builds.
# If TMPDIR is unset or empty, the reader appends /builds to the system temporary folder.
roots.temporary=${TMPDIR}/builds
# Set the temporary root for gate work. Keep the caller's temporary folder if it is already under this root.
# Use an absolute or relative directory path. Default is /dev/shm.
# When the gate starts, it checks that the selected directory exists and is writable.
roots.gate=/dev/shm
# Set the Mac override for the gate temporary root.
# Use an absolute or relative directory path. Default on this Mac is /private/tmp.
# When the gate starts, it checks that the selected directory exists and is writable.
roots.gate.Nates-MacBook-Pro-2023=/private/tmp
# natedev keeps scratch and copies on its build drive; the Mac has no /build.
roots.scratch=/tmp/claude/scratch
roots.scratch.natedev=/build/claude/scratch
roots.copies=/tmp/claude/copies
roots.copies.natedev=/build/claude/copies
# Set the common root for Cargo build output from slots and for Cargo seeding.
# Use a directory path. The reader expands variables and ~. Default is ~/build/cargo.
roots.slot_cargo=~/build/cargo
# Set the natedev override for the Cargo output root.
# Use a directory path. The reader expands variables and ~. Default on natedev is /build/cargo.
roots.slot_cargo.natedev=/build/cargo
# Append the absolute checkout path to this mirror prefix.
roots.cargo_paths.natedev=/build/paths
# Set the checkout root for each machine's shared <repository>-slot<N> folders.
# Use a directory path. The reader expands variables and ~.
# Defaults are /build/slot on natedev and ~/build/slot on the Mac.
# Other machines use roots.slots when set. They have no slots if both keys are absent.
roots.slots.natedev=/build/slot
roots.slots.Nates-MacBook-Pro-2023=~/build/slot
# Set the root for editable copies when SCRATCH_COPIES_ROOT is unset.
# Use a directory path. The reader expands ~. Default is ~/worktrees.
roots.workspace=~/worktrees
# The Hana renderer excludes this mirror root key from runtime archives.
# No runtime code reads this key's value. The file stores ~/rust/mirrors.
roots.mirror=~/rust/mirrors
# The Hana renderer excludes this shell root key from runtime archives.
# No runtime code reads this key's value. The file stores ~/rust/shells.
roots.shell=~/rust/shells
# One folder per Claude session (scripts/lib/session_folder.py). natedev binds /session to /build/session.
roots.session=~/session
roots.session.natedev=/session

[slots]
# Mark an unlocked slot for removal when its last use is older than this age.
# Use a positive whole number of days. Default is 7 days.
# whole: 1..
slots.unused_days=7
# Set the slot limit on natedev for a repository without its own limit.
# Use a positive whole number of slots. Default is 1 slot.
# whole: 1..
slots.natedev.default_max=1
# Set the slot limit for each listed natedev repository.
# Use positive whole numbers of slots. The defaults below override slots.natedev.default_max.
# whole: 1..
slots.natedev.claude_commands.max=11
# whole: 1..
slots.natedev.hana.max=7
# whole: 1..
slots.natedev.cargo-liner.max=5
# Set the slot limit on the Mac for a repository without its own limit.
# Use a positive whole number of slots. Default is 1 slot.
# whole: 1..
slots.Nates-MacBook-Pro-2023.default_max=1
# Set the slot limit for each listed Mac repository.
# Use positive whole numbers of slots. The defaults below override slots.Nates-MacBook-Pro-2023.default_max.
# whole: 1..
slots.Nates-MacBook-Pro-2023.hana.max=2
# whole: 1..
slots.Nates-MacBook-Pro-2023.cargo-liner.max=2
# The longest time a run waits in the build queue for a free slot.
# range: 5e-324..
slots.wait_seconds=5500

[patterns]
# Use format strings that produce paths below the parent folder.
# Available fields are {repository}, {owner}, {purpose}, {suffix}, {slot}, {showrunner}, {unit}, and {work}.
# The path must be nonempty and relative. It cannot contain . or .. as a component.
# Name work by showrunner, unit, work ID, and purpose. The maker uses a random ID if the caller omits the work ID.
# Default is {showrunner}-{unit}/{work}-{purpose}.
patterns.named={showrunner}-{unit}/{work}-{purpose}
# Name a temporary build folder by repository, owner, purpose, and random suffix.
# Default is {repository}/{owner}-{purpose}-{suffix}.
patterns.temporary={repository}/{owner}-{purpose}-{suffix}
# This pattern names a gate folder by purpose and random suffix.
# No production caller selects this pattern. Gate temporary folders use patterns.tool.
# Default is {purpose}-{suffix}.
patterns.gate={purpose}-{suffix}
# This pattern names a standing folder by repository and owner, with an optional suffix.
# No production caller selects this pattern. Standing checkouts use slots.
# Default is {repository}/{owner}-gate{suffix}.
patterns.standing={repository}/{owner}-gate{suffix}
# Name an editable copy by its repository, owner, and copy name.
# Default is {repository}-{owner}/{purpose}.
patterns.editable={repository}-{owner}/{purpose}
# Name a Linux remote mirror by repository, target, and slot number.
# Default is {repository}/{owner}-s{slot}.
patterns.mirror={repository}/{owner}-s{slot}
# This pattern names a target folder by purpose. No production caller selects this pattern.
# Default is {purpose}.
patterns.target={purpose}
# This pattern names a shell cache folder by repository.
# No production caller selects this pattern. The shell cache uses a content hash.
# Default is {repository}.
patterns.shell-cache={repository}
# Name a scratch folder by purpose and random suffix.
# Default is {purpose}-{suffix}.
patterns.scratch={purpose}-{suffix}
# Name a folder made by the unique allocator from its prefix and random suffix.
# Default is {purpose}{suffix}.
patterns.legacy-unique={purpose}{suffix}
# Name a folder made by the stable allocator from its supplied name.
# Default is {purpose}.
patterns.legacy-stable={purpose}
# Name a tool folder by the tool name. Add -2, -3, and higher suffixes when the earlier names are busy.
# Default is {purpose}{suffix}.
patterns.tool={purpose}{suffix}

[prefixes]
# Set the initial text of unique folder names for each caller kind.
# Use a nonempty single-component prefix. The unique command can substitute {owner}.
# The defaults are the prefixes listed below.
prefixes.targeted-test=targeted-test-
prefixes.merge-gate=merge-gate-
prefixes.suite-module={owner}-
prefixes.merge-gate-nightly=merge-gate-nightly-
prefixes.promotion-index=promotion-index-
prefixes.fast-track-index=fast-track-index-
prefixes.fast-track-check=fast-track-check-
prefixes.fast-track-restore-index=fast-track-restore-index-
prefixes.fast-track-promote=fast-track-promote-
prefixes.fast-track=fast-track-
prefixes.production-scratch=production-scratch-
prefixes.bump-gate=bump-gate-
prefixes.ci-point=ci-point-
prefixes.bulk-rule-test=bulk-rule-test-
prefixes.style-sync-lint=style-sync-lint-
prefixes.rust-release-trial=rust-release-trial-{owner}
prefixes.verify-tree=verify-tree.{owner}.
prefixes.copies-index=copies-index-
prefixes.verify-copy=verify-copy.{owner}.
prefixes.verify-hold=verify-hold.{owner}.
prefixes.queue-place=queue-place-
prefixes.admit-test=admit-test-
prefixes.admit-sock=admit-sock-
prefixes.copy-watch=copy-watch.
prefixes.linux-cache-stage=.{owner}.
prefixes.linux-step=.linux-step-
prefixes.style-review={owner}-
prefixes.checkpoint-doc=checkpoint-doc-
prefixes.checkpoint-paths=checkpoint-paths-

[locks]
# Set how long a folder lock probe can retry a busy lock.
# Use 0.001 to 60 seconds. Default is 0.25 seconds.
# range: 0.001..60
locks.probe_wait_seconds=0.25
# Set the delay between attempts to take a busy folder lock.
# Use 0.001 to 1 second. Default is 0.005 seconds.
# range: 0.001..1
locks.probe_retry_seconds=0.005

[seed]
# Control whether Cargo can copy reusable output from another checkout.
# Use 0 to disable seeding or 1 to enable it. Default is 0.
# whole: 0..1
seed.enabled=0
# Override the Cargo seeding switch on natedev.
# Use 0 to disable seeding or 1 to enable it. Default on natedev is 1.
# whole: 0..1
seed.enabled.natedev=1
# Limit the size of the files that one Cargo seed copies.
# Use a positive whole number of GiB. Default is 24 GiB.
# whole: 1..
seed.max_gib=24
# Require this much free disk space to remain after a Cargo seed copy.
# Use a nonnegative whole number of GiB. Default is 350 GiB.
# whole: 0..
seed.min_free_gib=350
