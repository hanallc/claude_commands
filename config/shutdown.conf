# Time allowed for a session to stop after SIGTERM.
# whole: 1..300
stop_grace_seconds=2

# Time allowed for a session to stop after SIGKILL.
# whole: 1..300
kill_grace_seconds=5

# Extra time allowed for an account move to stop a worker.
# whole: 1..300
move_stop_margin_seconds=3

# Time in minutes to suppress another push for the same move result.
# whole: 1..10080
move_alert_repeat_minutes=1440

# Time limit in seconds for a Herdr session to start during restart or resume.
# range: 5e-324..
start_seconds=20
# Longest time a restart waits for a started session to take its opening prompt.
# range: 5e-324..
opening_prompt_seconds=90
# Time in seconds to check that a restarted session stays running.
# range: 5e-324..
stay_seconds=10

# Time in seconds to wait for non-agent processes to leave a resume pane. Use 0 for no wait.
# range: 0..300
holder_exit_seconds=5

# Time a restart waits for the session's own pane to reach the shell.
# range: 0..300
own_pane_shell_seconds=30

# Time in seconds for stop and restart to wait for Herdr upkeep to release a row.
# range: 0..300
upkeep_row_wait_seconds=5

# Time in seconds for stop and restart to wait for the restart record lock.
# range: 5e-324..300
restart_record_lock_seconds=5

# Time between spinner updates during a reboot.
# range: 5e-324..10
reboot_spinner_seconds=0.1

# Store the reboot logs under the agents state folder.
reboot_log_folder=reboot

# Time allowed to confirm director work after restart.
# range: 0..3600
resume_check_seconds=180

# Time between transcript reads during the restart check.
# range: 5e-324..300
resume_check_interval_seconds=5
