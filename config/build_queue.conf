# Queue move controls on the Builds page.

# Set the exact Tailscale login of the person who can move queue rows.
# Leave this empty to disable queue moves from the console.
move_owner_login=

# Limit the time for authorization and each request to the admission service.
# range: 5e-324..
move_timeout_seconds=3

# Limit the size of a queue move request from the browser.
# whole: 1..
move_request_bytes=4096

# Show the highlight on a moved row for this time.
# range: 0..
move_highlight_seconds=2
