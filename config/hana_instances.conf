# Test Hana windows. Read on every hana-instances invocation.
# A port on this list does not identify a Hana as a test instance by itself.
# Use comma-separated port numbers from 1 to 65535, or leave the list empty.
# The shipped list is 15702,15761. A missing key in the live file or an invalid list causes an error.
exempt_ports=15702,15761

# The sweep selects a test Hana with an owner or purpose label for stopping when its age exceeds this many hours.
# The shipped value is 4 hours.
# range: 0..
test_max_hours=4

# The sweep selects a test Hana without an owner or purpose label for stopping when its age exceeds this many minutes.
# The shipped value is 30 minutes.
# range: 0..
unlabelled_max_minutes=30

# Wait this many seconds after SIGTERM before sending SIGKILL if the same Hana process remains.
# The shipped value is 5 seconds.
# range: 0..
stop_grace_seconds=5

# Idle test clones can be removed after this many hours.
# range: 0..
clone_max_hours=4
