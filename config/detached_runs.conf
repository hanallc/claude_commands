# Limit detached runs for each worker.
# Basis: 38,301 recorded runs; 90% of starts had at most 2 live runs for the worker. A test, a lint and a review often run together.
# whole: 1..
LIVE_RUN_LIMIT=3

# Basis: Keep the five-second limit for ps when /proc is unavailable.
# whole: 1..
PROCESS_CHECK_SECONDS=5

# Limit delayed retries for a failed result push.
# whole: 1..10
RESULT_PUSH_RETRIES=3

# Wait this many seconds before each delayed retry.
# range: 0.1..60
RESULT_PUSH_RETRY_SECONDS=5

# Limit each result line before the cut notice.
# whole: 1..
RESULT_LINE_CHARS=300

# Limit the complete result message.
# whole: 1..
RESULT_TEXT_CHARS=2000
