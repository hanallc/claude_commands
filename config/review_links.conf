# Maximum number of attempts to deliver a message, including the first attempt.
# whole: 1..20
delivery_tries=3
# Pause between message delivery attempts.
# range: 0..300
delivery_pause_seconds=5

# Set the height of each feedback box in rows.
# whole: 1..20
feedback_rows=5

# Limit an Images title in characters.
# whole: 1..
max_chars.image_title=80

# Set the height of the Your words box on each Review page card in rows.
# whole: 1..20
review_words_rows=4

# Set the delay in minutes for the first timed Park or Later choice.
# whole: 1..1440
later_soon_minutes=60
# No code reads later_evening or later_evening_until: the menu has no "This evening" choice.
# They stay until nate decides whether to delete them.
later_evening=18:00
later_evening_until=17:00
# Set the time for Tomorrow. Use 00:00 to 23:59 in the user zone.
later_morning=09:00
# Set the weekday for Next week. Use a full English weekday name, such as Monday.
later_week_day=Monday
# Set the time for Next week. Use 00:00 to 23:59 in the user zone.
later_week_time=09:00
# Set the interval in minutes between time choices in the date picker.
# whole: 1..60
park_time_step_minutes=15

# Update the review page while its browser tab is visible.
# range: 5..300
page_refresh_seconds=15

# Limit the time for immediate dialog refreshes after a save.
# whole: 1..120
page_delivery_window_seconds=30

# Reuse remote staff for this interval. After a failed read, use direct reads for this interval.
# A write through the server drops the snapshot when the action ends.
# range: 1..600
staff_snapshot_seconds=60

# Limit each List or Review page request (refresh, counts and linked records), in seconds.
# whole: 1..300
page_request_timeout_seconds=15

# Set the duration of a card fade out in milliseconds.
# whole: 1..5000
card_fade_out_ms=450

# Set the duration of a card fade in or slide in milliseconds.
# whole: 1..5000
card_fade_in_ms=600

# Limit the height of the List log and the Review log on a narrow page, in rem.
# whole: 1..80
list_log_max_height_rem=16

# Show this root's changes first in the legacy Changes browser's All view.
# Use a top-level showrunner name. If no name matches, sort roots by name.
changes_first_root=natedev

# Load a console page again this long after its load fails, such as during a server restart.
# Use the same delay for the automatic List Park retry.
# range: 0.5..60
frame_retry_seconds=2

# The showrunner receives alerts for unresolved staff conflicts.
# The showrunner also takes changes whose production document is gone.
# text: nonempty name
unrouted_alert_recipient=natedev
# Delay repeated alerts after an unsuccessful send.
# range: 5..3600
unrouted_alert_retry_seconds=60

# Limit each Accounts page render: the stored accounts status and one census.
# range: 1..120
accounts_page_seconds=30

# Show a warning when an account has this much weekly quota left or less.
# whole: 0..100
accounts_quota_warning_percent=10

# Show an urgent alert when an account has this much weekly quota left or less.
# whole: 0..100
accounts_quota_urgent_percent=5

# Treat weekly reset times as the same window when their difference is less than this many seconds.
# whole: 1..86400
accounts_quota_same_window_seconds=3600

# The server and published URLs use this port.
# whole: 1..65535
server_port=8765

# Limit each Tailscale address command.
# range: 0.001..
tailscale_timeout_seconds=10

# The Tailscale login that can use the Builds page queue controls: the move token, Move and Undo.
# Use local-node-owner for the owner of this node. An empty value lets no one act.
operator_login=local-node-owner

# Remove snapshots older than seven days (7 * 24 * 60 * 60 seconds).
# range: 0..
snapshot_retention_seconds=604800

# Limit the interval between snapshot sweeps to one hour (60 * 60 seconds).
# range: 0.001..
snapshot_sweep_seconds=3600

# Limit the interval between address checks.
# range: 0.001..
tailscale_check_seconds=60

# Limit the interval between loaded module checks.
# range: 0.001..
code_check_seconds=5

# Limit attempts to allocate a snapshot folder.
# whole: 1..86400
snapshot_allocation_tries=10

# reply_shot.py: wait this long for Claude Code to draw the resumed reply before the shot.
# whole: 1..120
reply_shot_render_seconds=12
# reply_shot.py: the terminal height in rows; the shot is cut to the reply after capture.
# whole: 24..400
reply_shot_terminal_rows=180
# reply_shot.py: a blank band of this many pixel rows ends the reply.
# whole: 8..400
reply_shot_gap_rows=40

# Remove unclaimed change images after this many days. Read at each sweep.
# range: 0..365
change_image_unclaimed_days=14

# Keep Review receipts and images in a private directory beside the snapshot root.
# An absolute path also works.
review_attachments_root=review-attachments

# Limit the form size for a Builds stop request.
# whole: 1024..65536
kill.request_bytes=4096

# Hold each answer, feedback, question and New item this long before it is sent, so the user can undo it.
# Zero turns Undo off.
# whole: 0..60
undo_seconds=10

# The Studio console page reads producer pictures from this folder.
# It holds one folder for each producer staff ID and the folder all, with NN-64.webp, NN-128.webp and NN-256.webp.
# A missing folder shows the initial of each name.
# text: absolute path; ~ expands to the home folder
studio_avatar_root=~/rust/hanadocs/morty/mockups/studio/avatars
