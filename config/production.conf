# Delay in seconds between process checks after SIGTERM during retirement.
# range: 5e-324..
RETIRE_POLL_SECONDS=0.2

# Maximum seconds to wait for a retirement process to exit after SIGTERM.
# range: 5e-324..
RETIRE_TERM_WAIT_SECONDS=10

# Time limit in seconds for each command during retirement.
# range: 5e-324..
RETIRE_COMMAND_TIMEOUT_SECONDS=900

# Maximum characters in the one-line question title.
# whole: 20..
question_title_max_chars=100

# Default run time in seconds for Hana on the Mac.
# whole: 1..
mac_run_hold_seconds=60

# SSH destination for the Mac run. Use a host name or user@host.
mac_run_host=natemccoy@mac

# BRP port number for Hana and the demo examples on the Mac. Use 1 through 65535.
# whole: 1..
mac_run_port=15710

# First port number in the inclusive BRP range for Hana units. Use 1 through 65535.
# Set unit_port_first to at most unit_port_last.
# whole: 1..
unit_port_first=15720

# Last port number in the inclusive BRP range for Hana units. Use 1 through 65535.
# whole: 1..
unit_port_last=15789

# File paths in this section refer to the Mac. Use nonempty paths.
# Path for the main Hana log.
mac_run_log=/tmp/mac_run_hana.log

# Path on the Mac for the command file that Terminal opens.
mac_run_launch=/tmp/mac_run_hana.command

# Path on the Mac for the exit status of the main Hana run.
mac_run_status=/tmp/mac_run_hana.status

# Run time in seconds for each demo example.
# whole: 1..
mac_run_example_seconds=20

# Former time limit in seconds for a Mac claim. The Mac run now uses the Mac queue.
# whole: 1..
mac_run_claim_seconds=600

# Minimum macOS version for the build. Use a version such as 14.0.
mac_run_deployment_target=14.0

# Extra checks for the Mac exit status. The command adds this count to the run time in seconds.
# At a one-second poll interval, each extra check adds one second.
# whole: 1..
mac_run_status_grace_seconds=60

# Delay in seconds between checks for the Mac exit status.
# whole: 1..
mac_run_poll_seconds=1

# Maximum main log lines after an early exit.
# whole: 1..
mac_run_log_lines=20

# Maximum example log lines after an early exit.
# whole: 1..
mac_run_example_log_lines=10

# Path on the Mac for the Git bundle when the clone needs the commit.
mac_run_bundle=/tmp/mac_run.bundle

# Path prefix on the Mac for example logs. The command appends the example name and .log.
mac_run_example_log_prefix=/tmp/mac_run_

# Path on the Mac to the repository used for the scratch clone. ~/ means the Mac home directory.
mac_run_source=~/rust/hana

# Separate demo examples with semicolons.
# Use space-separated Cargo package and example names, then an optional feature name.
mac_run_examples=hana_diegetic typography;hana_diegetic units;hana_diegetic widgets;hana_diegetic diegetic_text_stress;hana_conduit playground;hana_lagrange showcase fit_overlay;hana_liminal all_modes;hana_valence staggered_unfold;hana_mimesis_tools show_beam

# Default BRP port number for a smoke launch. Use 1 through 65535.
# It must differ from hana_shot.refused_port, the user's live Hana.
# whole: 1..
smoke_port=15790

# Maximum seconds to wait for BRP readiness after a smoke launch.
# whole: 1..
smoke_ready_seconds=300

# Maximum seconds to wait for Hana to exit after the BRP shutdown request.
# whole: 1..
smoke_exit_seconds=30

# Time limit in seconds to connect to BRP.
# whole: 1..
smoke_connect_seconds=1

# Time limit in seconds for a BRP request.
# whole: 1..
smoke_call_seconds=5

# Delay in seconds between TERM and KILL during smoke launch cleanup.
# whole: 1..
smoke_signal_grace_seconds=2

# Delay in seconds between checks for readiness or exit during a smoke launch.
# whole: 1..
smoke_poll_seconds=1

# Seconds at a permission prompt before the stall watcher notifies the owner.
# The user alert also waits for the prompt grace period.
# range: 0..
PROMPT_ALERT_SECONDS=60

# Maximum seconds for the selected sessions to become live after resume.
# range: 5e-324..
RENAME_LIVE_WAIT_SECONDS=180

# Maximum seconds for the selected sessions to stop.
# range: 5e-324..
RENAME_RUN_STOP_WAIT_SECONDS=120

# Delay in seconds between checks for session start or stop during a move.
# range: 5e-324..
RENAME_POLL_SECONDS=1

# Time limit in seconds for a rename Git command or a folder move.
# range: 5e-324..
RENAME_COMMAND_TIMEOUT_SECONDS=900

# Message address that receives unit table anomalies. Use a roster name or a session address.
UNIT_ANOMALIES_TO=sdlc

# Minutes before the sender can repeat the same unit anomaly message.
# range: 1..
units_anomaly_repeat_minutes=60

# Target width in terminal columns for the /showrunner:units style table.
# whole: 40..
units_table_columns=170

# Fallback width in terminal columns for the phase tables when the pane width is unavailable.
# whole: 40..
units_table_floor_columns=120

# Maximum wrapped lines per text cell before the phase table adds continuation rows.
# whole: 1..4
units_table_cell_lines=4

# When columns do not fit, the phase tables prefer to split words at least this many columns wide.
# Words with -, / or _ also qualify.
# whole: 2..
units_table_break_columns=30

# Time limit in milliseconds to read the calling pane's width for the phase tables.
# If the read fails or takes longer, use units_table_floor_columns.
# whole: 1..
units_table_width_read_milliseconds=50

# Time limit in seconds for one `cargo-handler census --json` read in /showrunner:units.
# If the read fails or takes longer, the table shows — for Status and Workers and prints an anomaly.
# range: 0.1..
units_census_seconds=10
