# Fast-track limits. Read for each command; no code defaults.
# Maximum sum of added and removed lines in the patch.
# whole: 1..
max_changed_lines = 100
# Maximum number of files in the patch.
# whole: 1..
max_files = 5
# Shared time limit in seconds for the Python tests, imports, and type check in one attempt.
# range: 5e-324..
check_time_limit_seconds = 120
# Maximum publication attempts. Retry when origin/main changes before publication.
# whole: 1..
max_push_attempts = 3
# Maximum attempts to fetch origin/main. Retry only if Git cannot lock the ref.
# whole: 1..
fetch_lock_attempts = 3
# Delay in seconds before retrying a fetch after a ref lock error.
# range: 0..
fetch_lock_wait_seconds = 0.5
# Space-separated repository paths and glob patterns that fast-track refuses.
# A directory path also excludes the files under it.
refused_paths = settings.json scripts/hooks/* scripts/lib/py .local/state/staff/staff.json **/staff.json scripts/production/staff.py scripts/production/staff_sources.py scripts/production/production_lifecycle.py scripts/production/add_unit.py scripts/production/add_showrunner.py scripts/production/promote_showrunner.py scripts/production/showrunner_parent.py scripts/production/staff_move.py scripts/production/transfer_unit.py scripts/production/rename*.py scripts/production/unit_move.py scripts/accounts/moves.py scripts/accounts/next_moves.py scripts/accounts/accounts.py scripts/agents/*.py scripts/production/merge_gate.py scripts/production/gate.py scripts/production/merge_checkpoint.py scripts/direct/verify.sh scripts/production/build_hold.py scripts/production/fast_track.py config/fast_track.conf
