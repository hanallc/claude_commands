# Gate checkouts use the configured machine and repository slot pool.
# scripts/lib/conf.py reads this file. Required settings have no code defaults.
[copies]
# Directory for remote mirror records and leases. Use an absolute path or a path with ~.
remote_registry=~/.local/state/copies/remote-mirrors
# Former delay in seconds between secondary checkout checks.
# The reader still requires a positive finite number. It no longer uses this value to wait.
wait_seconds=1
# Time limit in seconds for a Git command. Use a positive finite number.
git_timeout_seconds=600
# Time limit in seconds for the copy policy hook. Use a positive finite number.
# Codex rounds this limit up to a whole second.
guard_timeout_seconds=10
# Maximum branch combinations the guard expands for one command or word.
# Use a positive integer. If absent, the reader uses the repository setting.
guard_choice_limit=32
# Each row gives the fallback checkout owner for its role.
# Start with a lowercase letter or digit. Then use lowercase letters, digits, _ or -.
owner.nightly=nightly
owner.style=style
owner.verify=verify

# Each entry exempts a path relative to scripts/ from the copy policy scan.
# Give a nonempty reason for each exception.
[allow-list]
allow.copies/copies.py=The one implementation of standing gate checkouts.
allow.production/add_unit.py=Creates the original unit worktree.
allow.agents/shutdown.py=Restores the original unit worktree.
allow.style/add_style.py=Creates a unit's original checkout, like add_unit.py.
allow.bevy_migration_plan/bevy_migration_ensure_repo.sh=Clones external upstream at a version, not a copy of our work.
allow.worktree/make_worktree.sh=Makes an original work worktree, not a build copy.
allow.worktree/worktrees.py=Makes the original work worktree for make_worktree.sh and records it.
allow.lib/build_folders.py=The one build folder maker; it makes repository slot checkouts (build-folders D7).
