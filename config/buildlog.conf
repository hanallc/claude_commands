# Keep indexes from other schemas for inactive trees.
# Basis: user 2026-11-04: no opinion; the showrunner chose 2.
# update_in sets mtime at least each INDEX_TOUCH_MINUTES when a tree updates its index.
# Reads do not keep an index: complete_gate_index_in reads every index and refreshes atime.
# range: 0..
INDEX_UNUSED_DAYS=2

# Refresh the current index timestamp after this many minutes.
# Basis: record checkout use each hour without a write on every update; keep it well below INDEX_UNUSED_DAYS.
# range: 0..
INDEX_TOUCH_MINUTES=60

# Walk the build folders for the disk table at most once in this many minutes. Other runs of the disk job refresh only free and used space.
# Basis: builds 2026-11-12: a 10-minute walk read 45 MB/s for 8 minutes and made the keyboard stick.
# The 20-hour interval is below a day, so drift never skips the daily quiet-hour walk.
# whole: 1..
DISK_WALK_MINUTES=1200

# Run the full disk walk only in this hour of the day, in the user's zone.
# Basis: builds 2026-11-12: a walk at a random daytime minute makes the keyboard stick; 3 is a quiet hour.
# whole: 0..23
DISK_WALK_HOUR=3

# Rank costs over this many recent days.
# Basis: the user, 2026-11-15, chose the last 7 days.
# whole: 1..
TOP_COST_RECENT_DAYS=2

# Set the cache spill threshold in pages.
# Basis: WAL spill starts at 65,536 changed pages (256 MiB with 4096-byte pages).
# Explicit ON keeps this threshold enabled when SQLite reads the number as an 8-bit boolean.
# WAL rebuild, 2026-11-08: peak RSS 1,386,436 KiB; 240.09 s wall; load 108.2 to 61.3.
# whole: 1..
INDEX_SPILL_PAGES=65536

# Wait this many seconds for each index during selection.
# Basis: Selection can try another index; reads of the selected index use the database timeout.
# range: 0..
INDEX_READ_WAIT_SECONDS=1
