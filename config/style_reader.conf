# Source of tree inventories and name facts for style refill.
# one of: python, rust
reader=rust
# Required protocol number for the installed cargo-style.
# whole: 1..
protocol=1
# Minimum compatible cargo-style crate version.
# text:
minimum_version=0.1.0
# Local folder for versioned reader binaries and their source stamps.
# text:
install_folder=~/.local/state/style/reader
# Seconds the reader build may run, its memory queue wait included. The longest
# measured build took 63 min (60 min of memory queue wait, 2 min of build; 2026-11-16).
# range: 1..
build_limit_seconds=7200
# Seconds a stopped reader build has to end after TERM before KILL ends its process group.
# verify.sh uses this time to give back its memory queue place and its Mac claim.
# range: 1..
build_stop_grace_seconds=30
