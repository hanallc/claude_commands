# Use the Bubblewrap executable from the active system.
bubblewrap=/run/current-system/sw/bin/bwrap

# The proof module checks these live roots.
live_roots=/tmp/claude /tmp/claude-1000 /session /build ~/session ~/.claude ~/worktrees ~/rust ~/.local/state ~/.config ~/.cache ~/.codex ~/.cargo ~/.rustup ~/.local/share/review-links /etc/nixos /run/user/1000 /var/lib/hana-ci

# Keep the gate runtime settings. Replace the home, cache, and bus settings inside the guard.
kept_environment=PATH HOME USER CLAUDE_PYTHON XDG_CACHE_HOME PYTHONDONTWRITEBYTECODE LANG LANGUAGE LC_ALL LC_CTYPE LC_COLLATE LC_MESSAGES LC_MONETARY LC_NUMERIC LC_TIME LC_ADDRESS LC_IDENTIFICATION LC_MEASUREMENT LC_NAME LC_PAPER LC_TELEPHONE LOCALE_ARCHIVE XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS __NIXOS_SET_ENVIRONMENT_DONE __ETC_ZSHENV_SOURCED BUILDLOG_CALLER
