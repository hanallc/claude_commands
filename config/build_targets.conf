# Machines that can run build jobs, in the order a job tries them.
targets=hana-aws,mac,natedev
# Comma-separated targets that a caller can select by name outside the active target order.
# A missing or empty list adds no targets.
pinned_targets=hana-gpu
# kind.<target>: the target type. Use local or ssh.
# Placement can recover a missing or invalid value from Git.
kind.hana-gpu=ssh
# platform.<target>: the target platform. Use linux or macos.
# Placement can recover a missing or invalid value from Git.
platform.hana-gpu=linux
# settings.<target>: the settings file for an SSH target.
# Use an absolute path, a path that starts with ~, or a path relative to this file.
# Placement can recover a missing or invalid value from Git.
settings.hana-gpu=cloud_gate.conf
# Default target for clear, drain, and release.
default_target=natedev
kind.natedev=local
platform.natedev=linux
kind.mac=ssh
platform.mac=macos
settings.mac=mac_test.conf
# Register Hana without adding it to the active target order.
kind.hana-aws=ssh
platform.hana-aws=linux
settings.hana-aws=hana_aws.conf

# Maximum seconds for a notice to the hold's owner.
# range: 0.01..300
hold_sender_timeout_seconds=30

# Host names in synchronized records.
sync.hosts.natedev=natedev
sync.hosts.mac=Mac,Nates-MacBook-Pro-2023,mac,macbook
sync.hosts.aws=aws-build
# SSH connection timeout in seconds for peers outside the Mac and natedev host lists.
# Peers in those lists use the SSH configuration.
# Set a finite positive number. The reader has no per-key fallback.
sync.connect_timeout_s=10
# Timeout in seconds for the SSH command that checks the sync peer and refreshes its health record.
# Set a finite positive number. The reader has no per-key fallback.
sync.reach_timeout_s=30
# Timeout in seconds for each rsync push or pull.
# Set a finite positive number. The reader has no per-key fallback.
sync.rsync_timeout_s=600

# Production that receives vault stop questions.
vault.question_production=natedev
# Extra tries after a busy vault index lock.
# whole: 0..10
vault.lock_retries=5
# Seconds between tries after a busy vault index lock.
# range: 0..5
vault.lock_retry_delay_s=3
# Seconds to observe the same lock identity, or no identity, before asking the user.
# range: 1..86400
vault.lock_question_age_s=7200

# Manual Linux proof. This target does not enter the active target list.
loopback.host=natedev
# SSH port number for the proof. An empty value uses the port from the SSH configuration.
# The proof requires this key.
loopback.port=
# SSH host key file for the proof. A file path enables strict host key checking.
# An empty value uses the SSH configuration. The proof requires this key.
loopback.known_hosts=
# SSH connection timeout in seconds for the proof.
# The file sets 6. The proof can recover a missing or invalid value from Git.
# range: 1..60
loopback.connect_timeout_s=6
# Unused. The file lists 30 seconds. The proof uses loopback.command_timeout_s for remote commands.
loopback.probe_timeout_s=30
# Timeout in seconds for each proof SSH or rsync command and each Hana guest command.
# The proof can recover missing or invalid values from Git. Hana rejects them.
# range: 1..3600
loopback.command_timeout_s=600
# Minimum free space in GiB on the proof's output filesystems after a step.
# Below this floor, the runner removes the build folder.
# Set a finite positive number. The reader has no per-key fallback.
loopback.free_floor_gib=1
# Upper limit in GiB for loopback.target_budget_gib.
# Set a finite positive number. The reader has no per-key fallback.
loopback.build_budget_gib=16
# Sweep budget in GiB for the proof's build folder.
# Set a finite positive number at or below loopback.build_budget_gib.
# The reader has no per-key fallback.
loopback.target_budget_gib=1
# Timeout in seconds for nix print-dev-env in the proof and Hana guests.
# Set a finite positive number. The readers have no per-key fallback.
loopback.shell_timeout_s=120
# Nix development shell output for the proof. The file selects default.
# The proof requires this key. An empty value lets Nix select its default output.
loopback.shell=default
# Simulated total and available memory in GiB. The proof requires a finite positive value.
# The fixture starts with no history, so the gate uses its first Cargo memory estimate.
# Set at least that estimate plus the safety reserve.
loopback.memory_gib=16
