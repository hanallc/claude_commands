# Machines that can run build jobs, in the order a job tries them.
targets=hana-aws,mac,natedev
pinned_targets=hana-gpu
kind.hana-gpu=ssh
platform.hana-gpu=linux
settings.hana-gpu=cloud_gate.conf
# Default target for clear, drain, and release.
default_target=natedev
# Select how the queue runs builds on natedev.
# Use local or ssh. Default is local.
kind.natedev=local
# Select the platform that runs natedev builds.
# Use linux or macos. Default is linux.
platform.natedev=linux
# Select how the queue runs builds on the Mac.
# Use local or ssh. Default is ssh.
kind.mac=ssh
# Select the platform that runs Mac builds.
# Use linux or macos. Default is macos.
platform.mac=macos
# Select the file that supplies Mac target settings for ssh.
# Use a file path. A relative path starts beside this file. Default is mac_test.conf.
settings.mac=mac_test.conf
# Select how the queue runs builds on Hana AWS.
# Use local or ssh. Default is ssh.
kind.hana-aws=ssh
# Select the platform that runs Hana AWS builds.
# Use linux or macos. Default is linux.
platform.hana-aws=linux
# Select the file that supplies Hana AWS target settings for ssh.
# Use a file path. A relative path starts beside this file. Default is hana_aws.conf.
settings.hana-aws=hana_aws.conf

# Maximum seconds for a notice to the hold's owner.
# range: 0.01..300
hold_sender_timeout_seconds=30

# Host names in synchronized records.
sync.hosts.natedev=natedev
sync.hosts.mac=Mac,Nates-MacBook-Pro-2023,mac,macbook
sync.hosts.aws=aws-build
# Limit the SSH connection time for peers outside the configured Mac and natedev host lists.
# Use a positive number of seconds. Default is 10 seconds.
# SSH uses whole seconds and discards any fractional part. For example, 1.5 acts as 1.
sync.connect_timeout_s=10
# Limit the SSH command that checks the peer and prepares its buildlog directory.
# Use a positive number of seconds. Default is 30 seconds.
sync.reach_timeout_s=30
# Limit each rsync push or pull during buildlog sync.
# Use a positive number of seconds. Default is 600 seconds.
sync.rsync_timeout_s=600

# Production that receives vault stop questions.
vault.question_production=natedev
# Extra tries after a busy vault index lock.
# whole: 0..10
vault.lock_retries=5
# Seconds between tries after a busy vault index lock.
# range: 0..5
vault.lock_retry_delay_s=3
# Seconds to observe the same lock identity, or no identity, before asking the user.
# range: 1..86400
vault.lock_question_age_s=7200

# Manual Linux proof. This target does not enter the active target list.
# Select the SSH destination for the Linux proof.
# Use a nonempty SSH destination. Default is natedev.
loopback.host=natedev
# Select the SSH port for the Linux proof.
# Use a port number or service name. The proof passes the value to ssh -p.
# Leave it blank to use the SSH configuration. Default is blank.
loopback.port=
# Select the known_hosts file for the Linux proof.
# Use a file path. SSH reads this file and enables strict host key checking.
# Leave it blank to use the SSH configuration. Default is blank.
loopback.known_hosts=
# Limit the time SSH can take to connect for the Linux proof.
# Use 1 to 60 seconds. Default is 6 seconds.
# SSH uses whole seconds and discards any fractional part. For example, 1.5 acts as 1.
# range: 1..60
loopback.connect_timeout_s=6
# Limit each SSH or rsync command in the Linux proof. The Hana receiver also uses this limit for guest commands.
# Use 1 to 3600 seconds. Default is 600 seconds.
# range: 1..3600
loopback.command_timeout_s=600
# Delete the proof checkout's target folder after a run if free disk space is below this floor.
# Use a positive number of GiB. Default is 1 GiB.
loopback.free_floor_gib=1
# Set the upper limit for the Linux proof's repository output budget.
# Use a positive number of GiB. Default is 16 GiB.
loopback.build_budget_gib=16
# Set the Cargo output cleanup budget for the proof repository.
# Use a positive number of GiB up to loopback.build_budget_gib. Default is 1 GiB.
loopback.target_budget_gib=1
# Limit the Nix command that prepares the shell for the Linux proof and Hana runner.
# Use a positive number of seconds. Default is 120 seconds.
loopback.shell_timeout_s=120
# Select the Nix development shell for the Linux proof.
# Use the name of a development shell in the proof flake. Default is default.
loopback.shell=default
# Set both total and available RAM in the Linux proof's memory fixture.
# Use a positive number of GiB. Default is 16 GiB.
# Provide at least the first Cargo estimate plus the safety reserve.
loopback.memory_gib=16
