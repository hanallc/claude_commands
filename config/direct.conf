# The findings gate reads the review limits at startup.
# The file supplies the limits. The gate has no code defaults for them.
# An advisory limit adds a message to the dispatch verdict.
# routing_from_round and astra_after_failed_fixes require repair evidence.

# Minimum number of fix rounds in the advisory budget for a phase.
# whole: 1..
min_repair_budget=3

# Fix rounds per gating finding in the first review.
# The gate rounds the product up and applies min_repair_budget.
# range: 5e-324..
repair_rounds_per_finding=0.5

# Number of fix rounds that triggers the runaway advisory.
# whole: 1..
runaway_rounds=5

# Report when one finding has failed to close this many times.
# whole: 1..
max_fix_attempts=2

# Report when one finding has been reopened this many times after being accepted.
# whole: 1..
max_reopens=2

# Minimum number of charged fix rounds before the stall check. Use at least two.
# The check compares the current gating open count with the counts at the start of the last two charged rounds.
# It reports a stall if the count did not decrease at either step.
# whole: 2..
stalled_rounds=2

# Report when a worker reaches this many consecutive passes of the same kind in one phase.
# Count repeated launches of one fix batch once.
# whole: 1..
max_consecutive_same_kind_passes=3

# The gate adds an advisory when one worker exceeds this count of canceled reviews in one phase.
# whole: 0..
max_review_cancellations=1

# Seconds a Codex unit director waits per poll of a running dispatch.
# The standalone progress timer also uses this value when no argument sets its interval.
# whole: 1..
unit_progress_interval_seconds=3600

# Compact an idle Codex worker before dispatch if its recorded context exceeds this token count.
# whole: 1..
unit_compact_above_tokens=200000

# Seconds to wait for a Claude worker's session record after the background banner.
# whole: 1..300
claude_worker_register_wait_secs=30

# Seconds between Claude worker state reads.
# range: 0..
claude_worker_poll_secs=15

# First fix round that requires evidence for the kept categories and can trigger Astra review.
# whole: 1..
routing_from_round=4

# Failed fixes on an open gating finding that trigger an Astra review.
# The review is due as soon as either this count or routing_from_round is reached.
# A review at the same failed fix count satisfies the requirement.
# whole: 1..
astra_after_failed_fixes=2

# Enable or disable the daily simplify review.
# one of: on, off
simplify_lens=off

# For the first simplify review, use the last default-branch commit before this time.
# Use a date Git accepts for --before, such as an ISO 8601 timestamp with an offset.
# If no commit matches, use the root commit.
simplify_first_run_before=2026-11-05T22:50:00-05:00

# Space-separated agent names for the simplify prompt.
# The report must show the same number of completed agents.
simplify_agents=reuse simplification efficiency altitude

# Fraction of the combined pane size that the existing pane keeps after a split.
# A right split uses the pane width. A downward split uses the pane height.
# range: 0.1..0.9
worker_split_ratio=0.667

# Nonempty prompt text for a fresh Codex worker before staff publication.
worker_first_turn_text=Reply with ready. Do not use tools.

# Seconds available for the first Codex turn.
# range: 1..600
worker_first_turn_seconds=120

# Seconds to wait for a worker to finish its turn before dispatch.
# After sending to Codex, wait up to this many seconds for transcript evidence of submission.
# range: 1..600
worker_settle_seconds=30

# Seconds available for compaction before a dispatch.
# range: 1..1800
worker_compact_seconds=300

# Seconds available for a pane agent to start.
# range: 1..600
pane_agent_start_seconds=90

# Seconds available to acquire a published worker's fixed-id lock.
# range: 0.01..600
worker_publish_lock_seconds=15

# Seconds in each verify cargo token lease.
# whole: 1..
verify_token_hold_seconds=3600

# Seconds between renewals. Verify limits this value to one third of the lease.
# whole: 1..
verify_token_renew_seconds=60

# Maximum guard attempts for a token release or renewal.
# whole: 1..
token_guard_attempts=200

# Milliseconds between token guard attempts.
# whole: 1..
token_guard_delay_ms=50

# Test result keys include these exported names. Unset and empty values differ.
# text: space-separated variable names
verify_result_env_names=NO_COLOR CLICOLOR CLICOLOR_FORCE FORCE_COLOR CI TZ LANG LC_ALL LC_COLLATE LC_CTYPE LC_MESSAGES LC_MONETARY LC_NUMERIC LC_TIME LC_ADDRESS LC_IDENTIFICATION LC_MEASUREMENT LC_NAME LC_PAPER LC_TELEPHONE

# Test result keys include exported names with these prefixes.
# text: space-separated variable prefixes
verify_result_env_prefixes=HANA_ WGPU_ BEVY_ INSTA_ TRACE_

# Each test uses these terminal values on every target.
# text: space-separated NAME=value assignments
verify_test_fixed_env=TERM=xterm-256color COLORTERM=truecolor TERM_PROGRAM=verify COLUMNS=80 LINES=24
