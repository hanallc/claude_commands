# Copy the approved AWS history to the Mac.
# Source folder. Use an absolute path or a path under the local home folder.
source.folder = ~/.local/state/build-targets/aws

# Space-separated include patterns relative to the source folder.
include.patterns = cost-ledger.json cloud-gate-launches.jsonl deployment.json gate-deployment.json regional-stacks.json routing.json go-live.json controller.json builder-removal.json gate-region-times.json hours-gap-notices.json spot-price-days.json hana/setup.json hana/image.json hana/lifecycle.json release-evidence/** affinity/** charges/*.json gate-trial-*.json gate-trial-*.txt paired-trials/** hana/executions/**

# Space-separated exclude patterns relative to the source folder.
exclude.patterns = paired-trials/*/*/launch.json hana/executions/*.json hana/provider/** **/*.lock *.lock **/*.log *.log up gate-up unreachable_until

# Minutes between timer starts.
# whole: 1..
interval_minutes = 60

# Destination folder. Use an absolute path or a path under the Mac home folder.
mac.folder = ~/backups/natedev/aws-state
