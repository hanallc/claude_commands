# Idle update mode: docs/idle_update.md. The prompt hook reads these keys at use.

# Minutes with no prompt typed by nate in a producer, showrunner or unit session before the mode starts.
# whole: 1..120
after_minutes=5

# Minutes from one idle update to the next. The next update comes on the first turn after this time.
# whole: 1..240
renew_minutes=10

# Days after its last change that a session's idle record is deleted. A prompt nate types runs the sweep.
# whole: 1..365
retention_days=8
