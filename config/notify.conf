# Reviewer time limit in seconds. Caller waits include the post and a margin.
# range: 5e-324..
review_timeout_seconds=60

# Time in minutes to answer a push text approval request.
# range: 1..60
text_ask_minutes=5

# Maximum characters in the parent command and the Pushover sender name.
# The upper limit leaves room for the message and the template name.
# whole: 1..256
pushover.max_source_chars=80
