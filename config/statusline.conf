# Use #RRGGBB or a name from ACCOUNT_COLOR_NAMES in scripts/accounts/accounts.py.
# If a color is absent or invalid, use the default text color.
# role.<role-with-hyphens> colors the status line's staff assignment and the console's role labels.
role.showrunner=#a379fd
role.unit-director=#ffaf02
role.producer=#90fe42
role.astra-designer=mauve
role.astra-reviewer=bright-green
role.worker=#ff9898

# account.<label> colors account labels.
account.claude1=#53d5fd
account.claude2=#cd54f2
account.claude3=#ffc800
account.claude4=#ff8700
account.codex1=#90fe00
account.codex2=#3aa0ff
account.claude5=#fe4b42

# model.<full-model-id> colors model labels in the Accounts page.
model.claude-opus-5-5=#e08a5c
model.claude-fable-5-1=#c99cff
model.gpt-6.2-sol=#4fb3ff
model.gpt-6.2-astra=#3ddc97

# counts.<type> colors the count and label for that item type in the status line's Review row.
counts.questions=bright-red
counts.changes=bright-cyan
counts.efficiency=bright-green
counts.proposals=purple
counts.adhoc_items=pink

# Retry a failed counts read after this many seconds.
# whole: 1..
counts.retry_seconds=5

# Set the colors for normal, warning, and alarm usage levels.
level.ok=bright-green
level.warn=bright-yellow
level.alarm=bright-red
# Apply the warning or alarm color at or above this token percentage.
# Calculate the percentage as 100 * total_input_tokens / context_window_size.
# Use finite numbers.
tokens.warn=80
tokens.alarm=90
# Apply the warning or alarm color at or below this whole percentage of quota remaining.
# Use finite numbers for the thresholds.
left.warn=10
left.alarm=5

# Absolute path to the Git repository that supplies the system configurations.
rebuild.repo=/etc/nixos
# Working directories for rebuild commands on each machine. Use absolute paths or paths that start with ~/.
rebuild.cwd.natedev=/etc/nixos
rebuild.cwd.mac=~/nixos
# Git ref in rebuild.repo that supplies the expected natedev system.
rebuild.ref=main
# Git ref in rebuild.repo whose system the Mac rebuild builds.
rebuild.ref.mac=origin/main
# Name of the natedev system in the flake's nixosConfigurations.
rebuild.natedev=natedev
# Name of the Mac system in the flake's darwinConfigurations.
rebuild.mac=MacBook-Pro
# SSH destination for reading the Mac's running system and switch log.
rebuild.ssh=mac
# Cache lifetime in seconds for the rebuild comparison. Use a positive whole number.
# A config file newer than the cache makes the comparison due for refresh.
rebuild.interval=60
# Allow this many seconds for Nix evaluation. Use a positive whole number.
rebuild.eval_timeout=120
# Wait this many seconds before retrying a failed evaluation for the same commit. Use a positive whole number.
rebuild.eval_retry_seconds=600
# File that stores the rebuild comparison.
# Use an absolute path or a ~/ or ~user/ path that expands to an absolute path.
rebuild.cache=~/.local/state/showrunner/rebuilds
# Path to each machine's switch log. The Rebuilds page lists changes since the recorded switch.
# Use letters, digits, underscores, dots, slashes, and hyphens. An initial ~ is allowed.
rebuild.generations=~/.local/state/rebuild/generations.log
