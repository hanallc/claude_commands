# For every color setting, use #RRGGBB or a name from ACCOUNT_COLOR_NAMES in scripts/accounts/accounts.py.
# The readers use the default text color when a color is absent or invalid.
# The status line and console use role.showrunner, role.unit-director, role.producer, and role.worker.
# Both use role.worker for Astra designers and reviewers.
# The status line renderer uses the Astra colors only when a caller passes those role names directly.
role.showrunner=#a379fd
role.unit-director=#ffaf02
role.producer=#90fe42
role.astra-designer=mauve
role.astra-reviewer=bright-green
role.worker=#ff9898

# account.<label> sets the color of an account label in the status line and the Accounts page.
account.claude1=#53d5fd
account.claude2=#d64fff
account.claude3=#ffc800
account.claude4=#ff8700
account.codex1=#90fe00
account.codex2=#3aa0ff
account.claude5=#fe4b42

# background.codex-pair tints the Accounts page rows of the Codex accounts that take the workers in turn.
background.codex-pair=#7896ff

# model.<full-model-id> sets the color of a model label in the Accounts page.
model.claude-opus-5-5=#e08a5c
model.claude-fable-5-1=#c99cff
model.gpt-6.2-sol=#4fb3ff
model.gpt-6.2-astra=#3ddc97

# counts.<type> sets the color of the count and label for that item type in the status line's Review row.
counts.questions=bright-red
counts.changes=bright-cyan
counts.efficiency=bright-green
counts.proposals=purple
counts.adhoc_items=pink

# Wait this many seconds before retrying a failed read of the Review counts.
# whole: 1..
counts.retry_seconds=5

# level.ok, level.warn, and level.alarm set the colors for the token count and quota remaining.
# Apply a usage color only when both thresholds are valid.
# Apply the normal color when neither threshold is met.
level.ok=bright-green
level.warn=bright-yellow
level.alarm=bright-red
# Set the thresholds for the percentage of the context window used by input tokens.
# Use finite numbers in percent. Apply the alarm color first at or above its threshold.
# Apply the warning color at or above its threshold if the alarm threshold is not met.
tokens.warn=80
tokens.alarm=90
# Set the thresholds for the whole percentage of quota remaining.
# Use finite numbers in percent. Apply the alarm color first at or below its threshold.
# Apply the warning color at or below its threshold if the alarm threshold is not met.
left.warn=10
left.alarm=5

# Use the absolute path to the Git repository with the system configurations for the rebuild comparison.
rebuild.repo=/etc/nixos
# Set the working directory for rebuild commands on each machine.
# Use absolute paths or paths that start with ~/.
rebuild.cwd.natedev=/etc/nixos
rebuild.cwd.mac=~/nixos
# Select the commit used to evaluate the expected systems. Use a Git ref or ID that resolves to a commit.
rebuild.ref=main
# Select the expected system for natedev. Use a name from the flake's nixosConfigurations.
rebuild.natedev=natedev
# Select the expected system for the Mac. Use a name from the flake's darwinConfigurations.
rebuild.mac=MacBook-Pro
# Select the SSH destination for reading the Mac's running system and switch log.
# Use an SSH host name or alias that works in batch mode.
rebuild.ssh=mac
# Set the time in seconds until the cached rebuild result is due for refresh.
# Use a positive whole number. A newer config file also makes the result due.
# A refresh can reuse a failed result during the evaluation retry period.
rebuild.interval=60
# Limit Nix evaluation to this many seconds. Use a positive whole number.
rebuild.eval_timeout=120
# Set the retry period for a failed evaluation of the same commit and source.
# Use a positive whole number of seconds.
rebuild.eval_retry_seconds=600
# Set the path to the file that stores the rebuild comparison.
# Use an absolute path or a path with a home prefix that expands to an absolute path.
rebuild.cache=~/.local/state/showrunner/rebuilds
# Set the path to the switch log on each machine. The Rebuilds page lists changes since the recorded switch.
# Use letters, digits, underscores, dots, slashes, and hyphens. The path can start with ~.
rebuild.generations=~/.local/state/rebuild/generations.log
