# role.<role-with-hyphens> and account.<label> set field colors; a role with no key (unassigned)
# shows as plain text. The console Accounts page sets account, unit, showrunner, producer, and worker colors.
# level.* colors show usage levels; tokens.* are percent used, left.* percent left.
# counts.<type> colors each part of the "For you:" row; questions are red to catch the eye.
role.showrunner=#a379fd
role.unit-director=#858c00
role.producer=pink
role.astra-designer=mauve
role.astra-reviewer=bright-green
role.worker=#ff04a3

account.claude1=#53d5fd
account.claude2=#cd54f2
account.claude3=#ffc800
account.claude4=#ff8700
account.codex1=#ff1261
account.codex2=#4bf331
account.claude5=#19d772

model.claude-opus-5-5=#e08a5c
model.claude-fable-5-1=#c99cff
model.gpt-6.2-sol=#4fb3ff
model.gpt-6.2-astra=#3ddc97

counts.questions=bright-red
counts.changes=bright-cyan
counts.efficiency=bright-green
counts.proposals=purple
counts.adhoc_items=pink

# Retry a failed counts read after this many seconds.
# whole: 1..
counts.retry_seconds=5

level.ok=bright-green
level.warn=bright-yellow
level.alarm=bright-red
tokens.warn=80
tokens.alarm=90
left.warn=10
left.alarm=5

# Compare the running systems with the systems from this ref.
rebuild.repo=/etc/nixos
# Working directories for user rebuild commands on each target machine.
rebuild.cwd.natedev=/etc/nixos
rebuild.cwd.mac=~/nixos
rebuild.ref=main
rebuild.natedev=natedev
rebuild.mac=MacBook-Pro
rebuild.ssh=mac
rebuild.interval=60
# Allow this many seconds for Nix evaluation.
rebuild.eval_timeout=120
# Wait this many seconds before retrying a failed evaluation for the same commit.
rebuild.eval_retry_seconds=600
rebuild.cache=~/.local/state/showrunner/rebuilds
# Each machine's switch log; its last switch gives the commit the Rebuilds page lists changes after.
rebuild.generations=~/.local/state/rebuild/generations.log
