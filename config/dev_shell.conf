# Settings for the development shell that a test step loads. Read through
# scripts/lib/conf.py by scripts/lib/dev_shell.py.

# The flake devShells output that gives the test programs.
# text: nonempty name
selector=default

# The evaluated shells, relative to the home folder.
# text: nonempty path
cache=.local/state/build-target/shells

# Limit one shell evaluation; the first one on a host can download the shell.
# range: 1..3600
timeout_s=600
