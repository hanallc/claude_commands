# Publish the AWS page in this folder under the review root.
output_folder=~/.local/share/review-links/x2tl3v

# Count this many complete UTC days of checks for the Machines page.
# whole: 1..90
machines_window_days=7
# Mark a machine choice with fewer checks as a small sample.
# whole: 1..10000
machines_small_sample_checks=100
# Set the highest cost ratio on the Machines slider.
# range: 1..10
machines_ratio_max=3.00
# Set the change in cost ratio for one slider step.
# range: 0.01..1
machines_ratio_step=0.05
