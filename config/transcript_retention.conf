# Age in days since the last modification before compression. Use a value below delete_after_days.
# whole: 1..
compress_after_days = 14
# Age in days since the last modification before deletion. Use a value above compress_after_days.
# whole: 1..
delete_after_days = 60
# Maximum candidate files sampled per root during a dry run.
# whole: 1..
sample_files = 20
# Maximum bytes sampled from each candidate file.
# whole: 1..
sample_bytes = 1048576
