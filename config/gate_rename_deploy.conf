[gate_rename_deploy]

# Maximum time for stopped gates to exit.
# range: 5e-324..
stop_wait_seconds=120

# Time between progress messages during a wait.
# range: 5e-324..
heartbeat_seconds=30

# Time to add to the expected release time for a new drain hold.
# whole: 1..
drain_hold_eta_hours=1

# Time zone for progress messages and the release time.
time_zone=America/New_York

# Maximum number of output characters to show for a failed command.
# whole: 1..
error_output_characters=2000

# Folders with records to convert.
buildlog_folder=~/.local/state/buildlog
aws_state_folder=~/.local/state/build-targets/aws
review_page_folder=~/.local/share/review-links/h7uj5c

# Folders to search for live assignment wait records.
assignment_search_folders=/session /tmp /dev/shm /build/claude/scratch
temporary_folder=/tmp
mac_receipts_folder=~/.local/state/mac-queue/receipts
