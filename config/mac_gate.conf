# Read the placement on natedev. The gate adds the episode and attempt.
placement_check_command=ssh -o BatchMode=yes -o ConnectTimeout=6 natedev '~/.claude/scripts/lib/py ~/.claude/scripts/build_queue/admission_client.py placement-status'

# Seconds allowed for a placement check.
# whole: 1..
placement_check_timeout_seconds=10

# Seconds before another placement check.
# whole: 1..
placement_recheck_seconds=15

# Exit code for a gate refusal.
# whole: 1..255
refusal_exit_code=125

# The placement client runs on natedev.
admission_client_command=~/.claude/scripts/lib/py ~/.claude/scripts/build_queue/admission_client.py

# Seconds between TERM and KILL for the local SSH process.
# range: 5e-324..
terminate_grace_seconds=3

# Seconds allowed for disk image detach attempts in a gate folder.
# range: 5e-324..
cleanup.detach_seconds=10

# Seconds between attempts to detach a busy disk image.
# range: 5e-324..
cleanup.detach_interval_seconds=0.5
